<style>

.dots{display:flex;gap:3px}

<script>
const MILES=[
  {id:'m1',n:1,name:'启程',stage:'发芽',gift:'电子贺卡 + 伙伴语音祝福'},
  {id:'m7',n:7,name:'第一周',stage:'长高一大截',gift:'好习惯勋章 + 团队群表扬'},
  {id:'m21',n:18,name:'21 天',stage:'长出新枝',gift:'分格营养盒'},
  {id:'m30',n:25,name:'第一个月',stage:'结出花苞',gift:'精美保温杯'},
  {id:'m66',n:55,name:'66 天 习惯养成',stage:'开花',gift:'营养品大礼'},
  {id:'m90',n:75,name:'90 天 毕业',stage:'开满枝头',gift:'毕业证书 + 营养品'}
];
const CARE={
  1:{t:'第 1 天 · 伙伴关心',q:'营养开始吃了吗？你打算每天什么时候吃？',o:['早餐后吃','午餐后吃','晚餐后吃','还没开始吃'],
     r:a=>a==='还没开始吃'?'没关系，{p} 会联系你，帮你安排好。':'好的！以后每天'+a.replace('吃','')+'，打开这里点一下就好。'},
  3:{t:'第 3 天 · 伙伴关心',q:'吃了三天，身体感觉怎样？',o:['精神好像好一点','还没有什么感觉','肠胃有一点不习惯','有问题想问伙伴'],
     r:a=>({'精神好像好一点':'太好了，继续保持！','还没有什么感觉':'很正常，营养需要时间，坚持就对了。'})[a]||'点下面的按钮告诉 {p}，很快就会联系你。'},
  7:{t:'第 7 天 · 伙伴关心',q:'一个星期了！你每天都记得吃吗？',o:['每天都记得','偶尔会忘记','常常忘记'],
     r:a=>({'每天都记得':'好厉害！习惯已经在慢慢养成了。','偶尔会忘记':'小方法：把营养放在早餐桌上，看到就会记得。'})[a]||'{p} 会跟你一起想办法，比如设个闹钟。'},
  14:{t:'第 14 天 · 伙伴关心',q:'两个星期了，和第一天比较，精神、睡眠、肠胃有没有不一样？',o:['去记录我的感觉','等一下再说'],
     r:a=>a==='去记录我的感觉'?'好的，记录完 {p} 也会看到。':'好的，有空再记录。'},
  21:{t:'第 21 天 · 伙伴关心',q:'身边有没有朋友，也想一起照顾身体？',o:['有，请伙伴联系她','暂时没有'],
     r:a=>a==='暂时没有'?'没关系，你照顾好自己最重要。':'谢谢你！{p} 会先问过你，再联系她。'},
  28:{t:'第 28 天 · 伙伴关心',q:'你的营养还剩多少？',o:['还有很多','剩一个星期左右','已经吃完了'],
     r:a=>a==='还有很多'?'好的，继续每天吃。':'{p} 会联系你安排补货，不用中断。'},
  45:{t:'第 45 天 · 伙伴关心',q:'一个半月了，你觉得哪方面改变最多？',o:['精神','睡眠','肠胃','还在观察'],
     r:a=>a==='还在观察'?'每个人的身体不一样，继续记录，慢慢就会看到。':'谢谢你告诉我们！{p} 知道了一定很开心。'},
  60:{t:'第 60 天 · 伙伴关心',q:'两个月了！想不想请伙伴帮你看看这两个月的变化？',o:['好，请伙伴联系我','暂时不用'],
     r:a=>a==='暂时不用'?'好的，有需要随时找 {p}。':'好的，{p} 会联系你，一起看看你的记录。'},
  90:{t:'第 90 天 · 伙伴关心',q:'90 天到了！接下来你想怎样继续照顾自己？',o:['继续每天打卡','想请伙伴给我建议'],
     r:a=>a==='继续每天打卡'?'太好了，我们继续一起加油！':'好的，{p} 会联系你，给你一些建议。'}
};
const NEED={1:['还没开始吃'],3:['肠胃有一点不习惯','有问题想问伙伴'],7:['常常忘记'],21:['有，请伙伴联系她'],28:['剩一个星期左右','已经吃完了'],60:['好，请伙伴联系我'],90:['想请伙伴给我建议']};
const PLANS={
  base:{name:'基础营养',short:'基础',emoji:'🌿',desc:'每天吃营养，打好身体的底子',words:['基础'],tasks:[['water','喝够 8 杯水'],['veg','每餐都有蔬菜'],['move','走路或动一动 15 分钟']]},
  weight:{name:'体重管理',short:'体重',emoji:'⚖️',desc:'吃得均衡、多动一动，每星期记录一次体重',words:['体重','减重'],tasks:[['water','喝够 8 杯水'],['move','走路或动一动 20 分钟'],['meal','晚餐七分饱']],rec:'kg'},
  skin:{name:'美肌保养',short:'美肌',emoji:'✨',desc:'内外一起照顾：护肤、防晒、多喝水',words:['美肌','护肤','皮肤'],tasks:[['am','早上护肤、擦防晒'],['pm','晚上洗脸、护肤'],['water','喝够 8 杯水']],rec:'sk'}
};
/* ---------- a small Supabase client: anonymous sign-in for customers, email sign-in for partners ---------- */
const SB_URL='https://mlgrkrmfxfevzdouarmn.supabase.co',SB_KEY='sb_publishable_trymvh1krw3JgyhCZQwwiw_QA-pYJYr';
const SB={url:SB_URL,key:SB_KEY,sess:null,k:'sb_auth',
  load(k){this.k=k;try{this.sess=JSON.parse(localStorage.getItem(k)||'null')}catch(e){this.sess=null}return this.sess},
  store(s){this.sess=s;try{s?localStorage.setItem(this.k,JSON.stringify(s)):localStorage.removeItem(this.k)}catch(e){}return s},
  keep(j){if(!j||!j.access_token)return null;return this.store({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),user:j.user})},
  async call(path,o={}){
    const h={apikey:this.key,'Content-Type':'application/json',...(o.headers||{})};
    if(o.auth!==false&&this.sess)h.Authorization='Bearer '+this.sess.access_token;
    const r=await fetch(this.url+path,{method:o.method||'GET',headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined});
    const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){j=t}
    if(!r.ok){const e=new Error((j&&(j.msg||j.message||j.error_description||j.error))||('HTTP '+r.status));e.status=r.status;e.body=j;throw e}
    return j},
  async refresh(){const s=this.sess;if(!s||!s.refresh_token)return false;
    try{this.keep(await this.call('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:s.refresh_token},auth:false}));return true}
    catch(e){if(e.status>=400&&e.status<500)this.store(null);return false}},
  async req(path,o={}){
    if(o.auth!==false&&this.sess&&this.sess.expires_at-60<Date.now()/1000)await this.refresh();
    try{return await this.call(path,o)}
    catch(e){if(e.status===401&&o.auth!==false&&this.sess&&!o.again&&await this.refresh())return this.req(path,{...o,again:1});throw e}},
  async anon(){if(this.sess)return this.sess;return this.keep(await this.call('/auth/v1/signup',{method:'POST',body:{},auth:false}))},
  async signIn(email,password){return this.keep(await this.call('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password},auth:false}))},
  async signUp(email,password){return this.keep(await this.call('/auth/v1/signup',{method:'POST',body:{email,password},auth:false}))},
  signOut(){const s=this.sess;if(s)this.call('/auth/v1/logout',{method:'POST'}).catch(()=>{});this.store(null)},
  rpc(fn,args,o){return this.req('/rest/v1/rpc/'+fn,{method:'POST',body:args||{},...(o||{})})},
  uid(){return this.sess&&this.sess.user?this.sess.user.id:null}
};

/* ---------- team dashboard: partners follow up their own customers; leaders see the whole team ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const hash=s=>{let h=5381;for(const c of String(s))h=(h*33+c.codePointAt(0))>>>0;return h.toString(36)};
const STAGE=['','养成期','稳定期','习惯期'];
const own=(o,k)=>o!=null&&Object.prototype.hasOwnProperty.call(o,k);
const SITE=location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,'');
const normPhone=v=>{let d=String(v||'').replace(/\D/g,'');if(d.startsWith('0'))d='6'+d;return d.slice(0,15)};
const wa=(phone,text)=>`https://wa.me/${normPhone(phone)}?text=${encodeURIComponent(text)}`;
const ago=d=>{if(!d)return '还没打卡';const n=diff(d,today());return n<=0?'今天':n===1?'昨天':n+' 天前'};
const FACE=['','😣','🙁','😐','🙂','😄'];
let ME=null,CUS=[],NOTES={},GLOG={},PARTNERS=[],TAB='today',TEAMTAB='overview',QUERY='',PF='',LINKPLAN='base',LOADED=0,AUTH='login';

function toast(t){const el=$('#toast');el.textContent=t;el.className='show';clearTimeout(el._t);el._t=setTimeout(()=>el.className='',2600)}
function errText(e){const m=String(e&&e.message||e||'');
  if(/Invalid login/i.test(m))return 'email 或密码不对';
  if(/already registered|already been registered/i.test(m))return '这个 email 已经注册过了，请直接登录';
  if(/Password should be|at least 6/i.test(m))return '密码至少要 6 个字';
  if(/valid email|invalid format|unable to validate email/i.test(m))return 'email 格式不对';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return '网络不太稳定，请再试一次';
  return '出了一点问题：'+m}

/* ---------- what each customer needs, worked out from her saved record ---------- */
function info(c){
  const S=c.state&&typeof c.state==='object'?c.state:{},t=today(),ck=S.checks&&typeof S.checks==='object'?S.checks:{};
  const days=Object.keys(ck).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort(),n=days.length,last=days[n-1]||null,since=last?diff(last,t):null;
  const start=/^\d{4}-\d{2}-\d{2}$/.test(S.start||'')?S.start:null,done=GLOG[c.id]||new Set(),note=NOTES[c.id]||{};
  const plan=typeof S.plan==='string'&&own(PLANS,S.plan)?S.plan:'base',tk=S.tasks&&typeof S.tasks==='object'?S.tasks:{},wk=Array.from({length:7},(_,i)=>add(t,i-6));
  const tk7=PLANS[plan].tasks.map(([k,l])=>({k,l,days:wk.map(d=>own(tk,d)&&Array.isArray(tk[d])&&tk[d].includes(k))}));
  const kg=(Array.isArray(S.feel)?S.feel:[]).filter(f=>f&&typeof f.kg==='number'&&f.kg>=25&&f.kg<=250);
  const gifts=[],needs=[];
  for(const m of MILES){const v=S.gifts&&S.gifts[m.id];if(v&&!done.has(m.id))gifts.push({key:m.id,label:m.name,gift:m.gift,date:typeof v==='string'?v:''})}
  if(S.flips&&typeof S.flips==='object')for(const d of Object.keys(S.flips)){const f=S.flips[d];if(f&&f.type==='gift'&&!done.has('flip:'+d))gifts.push({key:'flip:'+d,label:'惊喜卡',gift:'小礼物一份',date:d})}
  if(S.onboarded&&(last?since>=2:(start&&diff(start,t)>=2)))needs.push({key:null,kind:'miss',text:last?`${since} 天没打卡`:'还没开始打卡'});
  if(S.answers&&typeof S.answers==='object')for(const d of Object.keys(S.answers)){const r=S.answers[d]||{};
    if(r.a&&own(NEED,d)&&NEED[d].includes(r.a)&&!done.has('care:'+d)&&(!r.d||diff(r.d,t)<=30))needs.push({key:'care:'+d,kind:'care',text:`第 ${d} 天：${r.a}`,q:own(CARE,d)?CARE[d].q:''})}
  if(Array.isArray(S.questions))for(const q of S.questions){if(!q||!q.text)continue;const k='q:'+hash((q.day||'')+'|'+q.text),qd=start&&q.day?add(start,q.day-1):null;
    if(!done.has(k)&&(!qd||diff(qd,t)<=30))needs.push({key:k,kind:'ask',text:'问题：'+q.text})}
  return {c,S,n,last,since,start,dn:start?diff(start,t)+1:0,stage:n>=56?3:n>=26?2:1,next:MILES.find(m=>n<m.n),gifts,needs,
    today:!!ck[t],act7:days.filter(d=>{const x=diff(d,t);return x>=0&&x<7}).length,phone:note.phone||'',note:note.note||'',
    name:String(S.name||c.name||'（没有名字）').slice(0,40),partner:c.partner_code,plan,tk7,kg}
}

/* ---------- data ---------- */
async function loadAll(){
  const [cus,notes,glog]=await Promise.all([
    SB.req('/rest/v1/customers?select=id,partner_code,name,state,checks,last_check,start_date,points,created_at,updated_at&order=updated_at.desc'),
    SB.req('/rest/v1/customer_notes?select=customer_id,phone,note'),
    SB.req('/rest/v1/gift_log?select=customer_id,gift_key,delivered_at')]);
  CUS=cus||[];NOTES={};(notes||[]).forEach(n=>NOTES[n.customer_id]=n);GLOG={};(glog||[]).forEach(g=>(GLOG[g.customer_id]=GLOG[g.customer_id]||new Set()).add(g.gift_key));
  PARTNERS=ME.is_leader?(await SB.req('/rest/v1/partners?select=user_id,name,phone,code,status,is_leader,created_at&order=created_at'))||[]:[ME];
  LOADED=Date.now();
}
async function boot(){
  SB.load('habit_team_auth');
  if(!SB.sess){ME=null;return render()}
  try{const r=await SB.req('/rest/v1/partners?select=*&user_id=eq.'+SB.uid());ME=r&&r[0]||null}
  catch(e){if(e.status===401||e.status===403){SB.store(null);ME=null;return render()}$('#app').innerHTML=`<div class="card"><p class="err">${esc(errText(e))}</p><button class="btn" data-act="reload">再试一次</button></div>`;return}
  if(ME&&ME.status==='active'){try{await loadAll()}catch(e){toast(errText(e))}}
  render();
}
async function mark(cid,keys){keys=keys.filter(Boolean);if(!keys.length)return;
  await SB.req('/rest/v1/gift_log?on_conflict=customer_id,gift_key',{method:'POST',body:keys.map(k=>({customer_id:cid,gift_key:k})),headers:{Prefer:'resolution=ignore-duplicates,return=minimal'}});
  keys.forEach(k=>(GLOG[cid]=GLOG[cid]||new Set()).add(k))}

/* ---------- screens ---------- */
function render(){
  const app=$('#app'),nav=$('#nav');
  if(!SB.sess){nav.hidden=true;app.innerHTML=viewAuth();return}
  if(!ME){nav.hidden=true;app.innerHTML=viewProfile(true);return}
  if(ME.status==='pending'){nav.hidden=true;app.innerHTML=viewPending();checkLeader();return}
  if(ME.status!=='active'){nav.hidden=true;app.innerHTML=`<div class="card"><h2>你的帐号已经停用</h2><p class="muted">有问题请联系你的领导。</p><button class="btn" data-act="logout">退出登录</button></div>`;return}
  const M=mine(),need=M.filter(x=>x.needs.length).length+M.reduce((s,x)=>s+(x.gifts.length?1:0),0);
  const T=[['today','今天',need],['cus','客人',0],...(ME.is_leader?[['team','团队',PARTNERS.filter(p=>p.status==='pending').length]]:[]),['link','我的链接',0]];
  $('#navin').innerHTML=T.map(([k,l,b])=>`<button data-tab="${k}" aria-current="${TAB===k?'page':'false'}">${l}${b?`<span class="badge">${b}</span>`:''}</button>`).join('');
  nav.hidden=false;
  app.innerHTML=(TAB==='cus'?viewCustomers(M):TAB==='team'&&ME.is_leader?viewTeam():TAB==='link'?viewLink():viewToday(M));
  if(TAB==='link')drawQR();
}

      <section class="card"><h3>伙伴</h3>${actv.map(p=>pr(p)+(p.user_id===ME.user_id?'<span class="small muted">（你自己）</span>':`<button class="btn sm" data-act="pleader" data-uid="${p.user_id}" data-v="${p.is_leader?'0':'1'}">${p.is_leader?'取消领导':'设为领导'}</button><button class="btn sm" data-act="pstatus" data-uid="${p.user_id}" data-v="disabled">停用</button>`)+'</div></div>').join('')}</section>
      ${dis.length?`<section class="card"><h3>已停用</h3>${dis.map(p=>pr(p)+`<button class="btn sm" data-act="pstatus" data-uid="${p.user_id}" data-v="active">恢复</button></div></div>`).join('')}</section>`:''}`;
  }else{
    const q=QUERY.trim(),L=A.filter(x=>(!q||x.name.includes(q))&&(!PF||x.plan===PF)).sort((a,b)=>String(b.last||'').localeCompare(String(a.last||'')));
    body=`${planFilter(A)}<input id="q" placeholder="找名字" value="${esc(QUERY)}" style="margin:2px 0 4px"><div class="card">${L.length?L.map(x=>cusRow(x,pname(x.partner))).join(''):'<p class="empty">没有找到</p>'}</div>`;
  }
  return `<h1>团队</h1><div class="tabs2" style="flex-wrap:wrap">${T.map(([k,l])=>`<button data-tt="${k}" aria-pressed="${TEAMTAB===k}">${l}</button>`).join('')}</div>`+body}

/* ---------- one customer ---------- */
function openCus(id){
  const c=CUS.find(x=>x.id===id);if(!c)return;const x=safeInfo(c),S=x.S,t=today();
  const grid=Array.from({length:28},(_,i)=>{const d=add(t,i-27);return `<span class="${S.checks&&S.checks[d]?'on':''}${d===t?' today':''}" title="${d}">${pd(d).getDate()}</span>`}).join('');
  const feel=(Array.isArray(S.feel)?S.feel:[]).filter(f=>f&&typeof f==='object').slice(-6).reverse(),hasSk=feel.some(f=>f.sk);
  const K=x.kg,kd=K.length>1?K[K.length-1].kg-K[0].kg:0;
  const ans=S.answers&&typeof S.answers==='object'?Object.keys(S.answers).sort((a,b)=>a-b):[];
  const qs=Array.isArray(S.questions)?S.questions:[];
  const reached=MILES.filter(m=>S.gifts&&S.gifts[m.id]);
  const done=GLOG[c.id]||new Set();
  $('#modal').innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(x.name)}">
    <div class="top"><div><h2>${esc(x.name)}</h2><p class="muted small">${ME.is_leader&&c.partner_code!==ME.code?esc(pname(c.partner_code))+' 的客人 · ':''}${PLANS[x.plan].emoji} ${esc(PLANS[x.plan].name)} · 第 ${x.dn} 天 · 累计 ${x.n} 天 · ${STAGE[x.stage]} · 积分 ${esc(S.points||0)}</p></div><button class="btn sm" data-act="close">关闭</button></div>
    ${x.needs.length?`<div class="card">${x.needs.map(n=>`<span class="tag${n.kind==='miss'?'':n.kind==='ask'?' b':' y'}">${esc(n.text)}</span>`).join('')}${x.needs.some(n=>n.key)?`<div style="margin-top:8px"><button class="btn sm" data-act="handled" data-id="${c.id}">已跟进</button></div>`:''}</div>`:''}
    <div class="card"><h3>最近 4 个星期</h3><div class="grid28">${grid}</div><p class="small muted">最后打卡：${ago(x.last)} · 宠物：${esc(S.petName||'')}（${S.pet==='dog'?'小狗':'小猫'}）</p></div>
    <div class="card"><h3>小任务（最近 7 天）</h3>${x.tk7.map(r=>`<div class="tkrow"><span>${esc(r.l)}</span><span class="dots" aria-hidden="true">${r.days.map(on=>`<i class="${on?'on':''}"></i>`).join('')}</span><b>${r.days.filter(Boolean).length}/7</b></div>`).join('')}<p class="small muted">每一格是一天，最右边是今天</p></div>
    ${K.length?`<div class="card"><h3>体重记录</h3>${K.length>1?`<p>第一次 <b>${kgFmt(K[0].kg)}</b> 公斤 → 最近 <b>${kgFmt(K[K.length-1].kg)}</b> 公斤 <span class="tag${kd<=-.05?' g':kd>=.05?' y':''}">${Math.abs(kd)<.05?'没有变化':(kd<0?'−':'+')+kgFmt(Math.abs(kd))+' 公斤'}</span></p>`:''}<table><tr><th>日期</th><th class="n">公斤</th></tr>${K.slice(-8).reverse().map(f=>`<tr><td>${esc(f.d||'')}</td><td class="n">${kgFmt(f.kg)}</td></tr>`).join('')}</table></div>`:''}
    <div class="card"><h3>感觉记录</h3>${feel.length?`<table class="feel"><tr><th>日期</th><th>精神</th><th>睡眠</th><th>肠胃</th>${hasSk?'<th>皮肤</th>':''}</tr>${feel.map(f=>`<tr><td>${esc(f.d||'')}</td><td class="faces">${FACE[f.e]||''} ${esc(f.e)}</td><td class="faces">${FACE[f.s]||''} ${esc(f.s)}</td><td class="faces">${FACE[f.g]||''} ${esc(f.g)}</td>${hasSk?`<td class="faces">${f.sk?FACE[f.sk]+' '+esc(f.sk):'–'}</td>`:''}</tr>`).join('')}</table>`:'<p class="empty">还没有记录</p>'}</div>
    <div class="card"><h3>关心问题的回答</h3>${ans.length?ans.map(d=>`<div class="item"><p class="small muted">第 ${esc(d)} 天 · ${esc(own(CARE,d)?CARE[d].q:'')}</p><p><b>${esc(S.answers[d]&&S.answers[d].a)}</b></p></div>`).join(''):'<p class="empty">还没有</p>'}</div>
    ${qs.length?`<div class="card"><h3>她问过的问题</h3>${qs.map(q=>`<div class="item"><p class="small muted">第 ${esc(q.day)} 天</p><p>${esc(q.text)}</p></div>`).join('')}</div>`:''}
    <div class="card"><h3>礼物</h3>${reached.length?reached.map(m=>`<div class="item"><div class="top"><div><span class="tag g">${esc(m.name)}</span><span class="small">${esc(m.gift)}</span></div>${done.has(m.id)?'<span class="small muted">已送出 ✅</span>':`<button class="btn green sm" data-act="gift" data-id="${c.id}" data-key="${m.id}">已送出</button>`}</div></div>`).join(''):'<p class="empty">还没达到礼物天数</p>'}
      ${x.next?`<p class="small muted" style="margin-top:6px">下一份：再 ${x.next.n-x.n} 天，${esc(x.next.name)} · ${esc(x.next.gift)}</p>`:''}</div>
    <div class="card"><h3>备注（只有伙伴和领导看得到）</h3>
      <label for="n_phone">她的 WhatsApp 号码</label><input id="n_phone" inputmode="tel" value="${esc(x.phone)}" placeholder="例如：0123456789">
      <label for="n_note">备注</label><textarea id="n_note" maxlength="500">${esc(x.note)}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn solid" data-act="savenote" data-id="${c.id}">保存备注</button><a class="btn wa" href="${wa(x.phone,`${x.name} 你好！`)}" target="_blank" rel="noopener">WhatsApp 联系</a></div></div>
    <div class="card"><h3>她换了手机？</h3><p class="small muted">生成恢复链接，用 WhatsApp 发给她。她用新手机打开，就能接回原来的记录。链接 3 天内有效，只能用一次。</p><div id="rlink"></div><button class="btn" data-act="restore" data-id="${c.id}">生成恢复链接</button></div>
  </div>`;
  $('#modal').hidden=false;$('#modal').dataset.id=id;
}

/* ---------- actions ---------- */
document.addEventListener('submit',async e=>{
  if(e.target.id!=='authf')return;e.preventDefault();const reg=AUTH==='reg',err=$('#f_err'),btn=e.target.querySelector('button[type=submit]');
  const email=$('#f_email').value.trim(),pw=$('#f_pw').value;err.hidden=true;btn.disabled=true;
  try{
    if(reg){const name=$('#f_name').value.trim(),phone=normPhone($('#f_phone').value);if(!name||!phone)throw new Error('请填名字和 WhatsApp 号码');
      const s=await SB.signUp(email,pw);if(!s)throw new Error('注册成功，请直接登录');
      await SB.req('/rest/v1/partners',{method:'POST',body:{user_id:SB.uid(),name,phone},headers:{Prefer:'return=minimal'}})}
    else await SB.signIn(email,pw);
    await boot();
  }catch(x){err.textContent=x.message&&/请填|请直接登录/.test(x.message)?x.message:errText(x);err.hidden=false;btn.disabled=false}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){QUERY=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}}});
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.auth){AUTH=b.dataset.auth;render();return}
  if(b.dataset.tab){TAB=b.dataset.tab;QUERY='';PF='';$('#modal').hidden=true;render();scrollTo(0,0);return}
  if(b.dataset.tt){TEAMTAB=b.dataset.tt;QUERY='';PF='';render();return}
  if('pf' in b.dataset){PF=own(PLANS,b.dataset.pf)?b.dataset.pf:'';render();return}
  if(b.dataset.lp){LINKPLAN=own(PLANS,b.dataset.lp)?b.dataset.lp:'base';render();return}
  const a=b.dataset.act,id=b.dataset.id;if(!a)return;
  try{
    if(a==='reload'){location.reload();return}
    if(a==='logout'){SB.signOut();ME=null;CUS=[];render();return}
    if(a==='refresh'){b.disabled=true;await loadAll();render();toast('已经是最新的资料');return}
    if(a==='close'){$('#modal').hidden=true;return}
    if(a==='cus'){openCus(id);return}
    if(a==='leader'){b.disabled=true;const ok=await SB.rpc('claim_first_leader');toast(ok?'你现在是团队领导了':'团队已经有领导了');await boot();return}
    if(a==='saveprofile'){const name=$('#p_name').value.trim(),phone=normPhone($('#p_phone').value);if(!name){toast('请填名字');return}
      if(ME){const r=await SB.req('/rest/v1/partners?user_id=eq.'+SB.uid(),{method:'PATCH',body:{name,phone},headers:{Prefer:'return=representation'}});ME=r&&r[0]||ME;toast('已保存')}
      else{await SB.req('/rest/v1/partners',{method:'POST',body:{user_id:SB.uid(),name,phone},headers:{Prefer:'return=minimal'}});await boot();return}
      render();return}
    if(a==='copy'){const t=b.dataset.text;try{await navigator.clipboard.writeText(t);toast('已复制')}catch(_){prompt('请复制下面的内容',t)}return}
    if(a==='gift'){b.disabled=true;await mark(id,[b.dataset.key]);toast('已记录：礼物送出了');if(!$('#modal').hidden)openCus(id);render();return}
    if(a==='handled'){b.disabled=true;const c=CUS.find(x=>x.id===id);await mark(id,safeInfo(c).needs.map(n=>n.key));toast('已记录：跟进好了');if(!$('#modal').hidden)openCus(id);render();return}
    if(a==='savenote'){const phone=normPhone($('#n_phone').value),note=$('#n_note').value.slice(0,500);
      await SB.req('/rest/v1/customer_notes?on_conflict=customer_id',{method:'POST',body:{customer_id:id,phone,note,updated_at:new Date().toISOString()},headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});
      NOTES[id]={customer_id:id,phone,note};toast('备注已保存');openCus(id);render();return}
    if(a==='restore'){b.disabled=true;const code=await SB.rpc('make_restore_code',{p_customer:id}),c=CUS.find(x=>x.id===id),x=safeInfo(c),link=SITE+'?restore='+code;
      $('#rlink').innerHTML=`<div class="link" style="margin:6px 0">${esc(link)}</div><div class="row"><a class="btn wa" href="${wa(x.phone,`${x.name} 你好，这是你的小花恢复链接，用新手机打开就能接回原来的记录（3 天内有效）：\n${link}`)}" target="_blank" rel="noopener">用 WhatsApp 发给她</a><button class="btn" data-act="copy" data-text="${esc(link)}">复制</button></div>`;return}
    if(a==='pstatus'){b.disabled=true;await SB.req('/rest/v1/partners?user_id=eq.'+b.dataset.uid,{method:'PATCH',body:{status:b.dataset.v},headers:{Prefer:'return=minimal'}});await loadAll();render();toast(b.dataset.v==='active'?'已批准':'已更新');return}
    if(a==='pleader'){b.disabled=true;await SB.req('/rest/v1/partners?user_id=eq.'+b.dataset.uid,{method:'PATCH',body:{is_leader:b.dataset.v==='1'},headers:{Prefer:'return=minimal'}});await loadAll();render();toast('已更新');return}
    if(a==='assign'){const sel=document.querySelector(`select[data-assign="${id}"]`);if(!sel||!sel.value)return;b.disabled=true;await SB.rpc('assign_customer',{p_customer:id,p_code:sel.value});await loadAll();render();toast('已分配');return}
  }catch(x){toast(errText(x));b.disabled=false}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').hidden=true});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').hidden=true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ME&&ME.status==='active'&&Date.now()-LOADED>60000&&$('#modal').hidden)loadAll().then(render).catch(()=>{})});
boot();
</script>
</body>
</html>
