<style>
/* 「日签」: the page reads like the morning card she shares — a big serif date, one plant, quiet sage paper,
   one accent colour. The day-card at the top takes today's morning-card tint; everything else stays calm. */
:root{
  --paper:#F2F4EF; --surface:#FFFFFF; --ink:#1F2B24; --muted:#5F6B63; --line:#DDE3DA;
  --accent:#2F5D46; --accent-deep:#234836; --accent-soft:#E4ECE5; --on-accent:#FFFFFF;
  --gold:#86682A; --gold-bright:#C9A659; --gold-soft:#F4EEDD;
  --shadow:rgba(31,43,36,.08);
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  /* titles: the phone's own Chinese sans, bold and clear, nothing to download; big numbers keep the serif digits */
  --f-serif:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  --f-num:"DM Serif Display",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
  /* older names kept so every part of the page follows the same palette */
  --bg:var(--paper); --coral:var(--accent); --coral-deep:var(--accent-deep); --coral-soft:var(--accent-soft); --coral-text:var(--accent); --on-coral:var(--on-accent);
  --leaf:var(--accent); --leaf-dark:var(--accent); --leaf-soft:var(--accent-soft); --on-leaf:var(--on-accent);
  --f-fun:var(--f-serif);
  --pot:#C4876A; --soil:#6A4B39; --petal:#E07A8F; --petal2:#F2A98C; --water:#5E9CCB;
  --sky1:#E9EEE6; --sky2:#F6F8F4;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121714; --surface:#1A211D; --ink:#E9EFEA; --muted:#A3AFA7; --line:#2C3630;
  --accent:#8CC2A3; --accent-deep:#5E9478; --accent-soft:#213129; --on-accent:#0E1A13;
  --gold:#D9B76E; --gold-bright:#C9A04E; --gold-soft:#2E2918;
  --shadow:rgba(0,0,0,.4); --soil:#4B3427; --sky1:#1C241F; --sky2:#161C18; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121714; --surface:#1A211D; --ink:#E9EFEA; --muted:#A3AFA7; --line:#2C3630;
  --accent:#8CC2A3; --accent-deep:#5E9478; --accent-soft:#213129; --on-accent:#0E1A13;
  --gold:#D9B76E; --gold-bright:#C9A04E; --gold-soft:#2E2918;
  --shadow:rgba(0,0,0,.4); --soil:#4B3427; --sky1:#1C241F; --sky2:#161C18; color-scheme:dark}

html{font-size:20px} html.fs-s{font-size:18px} html.fs-m{font-size:20px} html.fs-l{font-size:23px}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.7;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{font-family:var(--f-serif);font-weight:700;letter-spacing:.01em;text-wrap:balance}
p,li{text-wrap:pretty}
.h-cap,.task .tt,.rowi .rt,.checkin,.btn,.opt,.reply p,#overlay .box>p:not(.nbody),footer.fine{text-wrap:balance}
/* short display lines break at punctuation or spaces, never inside a phrase like 七分饱 or 健康花 */
h1,h2,h3,h4,.h-cap,.p-fact,.reply p,.opt,#overlay .box>p:not(.nbody){word-break:keep-all;overflow-wrap:anywhere}
.h-cap,.p-fact,.ntitle,#overlay .medal{font-feature-settings:"halt"}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold-bright);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px calc(6rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:.8rem;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.ok{background:var(--accent);color:var(--on-accent)}
.gold{color:var(--gold);font-weight:700}

/* the day-card: her windowsill. The view outside follows the time of day; the wall takes today's morning-card colour */
.hero{--wall:#E4EADF;--t-ink:#2E4233;--bar-bg:rgba(255,255,255,.6);position:relative;border-radius:30px;padding:20px 20px 16px;background:var(--wall);color:var(--t-ink);display:flex;flex-direction:column;gap:4px;overflow:hidden}
.h-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.h-date{display:flex;align-items:center;gap:10px}
.h-num{font-family:var(--f-num);font-size:3.4rem;line-height:.9;font-variant-numeric:lining-nums}
.h-md{font-family:var(--f-serif);font-weight:600;font-size:.9rem;line-height:1.35;opacity:.85}
.h-pts{flex:none;font-size:.85rem;padding-top:4px;opacity:.9;white-space:nowrap}
.h-pts b{font-family:var(--f-num);font-weight:400;font-size:1.25rem;margin-left:.3em;color:inherit}
.h-pts.bump b{display:inline-block;animation:bump .6s}
.h-greet{position:relative;z-index:1;font-size:1.5rem;line-height:1.35;margin-top:8px;text-wrap:balance;letter-spacing:.03em}
.h-fest{font-size:.85rem;opacity:.8}
.h-cap{align-self:center;text-align:center;font-family:var(--f-serif);font-weight:600;font-size:.95rem;line-height:1.5;text-wrap:balance;margin-top:2px}
.h-cap.mute{font-family:var(--f-body);font-weight:400;opacity:.75}
.h-cap.new{animation:pop .6s ease-out 1.1s both}
.h-foot{display:flex;flex-direction:column;gap:6px;font-size:.85rem;margin-top:6px}
.h-foot b{font-family:var(--f-num);font-weight:400;font-size:1.15rem}
.h-foot .bar{background:var(--bar-bg)}
.h-foot .bar i{background:currentColor;opacity:.7}
.hero .checkin{margin:10px -10px 4px;width:calc(100% + 20px);padding-inline:14px;gap:10px}
.hero .checkin .ic{width:2rem;height:2rem}
.hero .link-btn{color:inherit;opacity:.8;margin:-6px 0 -4px}
/* short screens (a small phone, or the browser inside WhatsApp): tighten the day-card so the button stays on the first screen.
   The caption before the check-in only repeats the button's own line, so it steps aside. */
@media (max-height:720px){
  .hero{padding-top:14px;gap:2px}
  .h-num{font-size:2.7rem}
  .h-greet{font-size:1.32rem;margin-top:2px}
  .h-scene{margin-top:0}
  .h-cap.pre{display:none}
  .hero .checkin{min-height:3.6rem;margin-top:6px;padding-block:8px}
}
/* the shortest screens (a small phone inside WhatsApp): a festival or Friday line would push the button under the tabs; the pet's costume still shows it */
@media (max-height:600px){.h-fest{display:none}}
/* the scene keeps the room's proportions, so the plant always stands on the sill */
.h-scene{position:relative;margin:4px -20px 0;aspect-ratio:390/300}
.h-scene .room{position:absolute;inset:0;width:100%;height:100%;display:block}
.h-scene .plant{position:absolute;left:0;right:0;bottom:12.3%;margin:0}
.h-scene .plant::after{display:none}
.h-scene .cup{position:absolute;right:8%;bottom:11.4%;width:10.5%;height:auto;display:block}
.steam{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;opacity:0;animation:steam 4s ease-in-out infinite}
.steam.b{animation-delay:2s}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}35%{opacity:.5}100%{opacity:0;transform:translateY(-7px)}}
.plant{position:relative;height:12.5rem;display:flex;justify-content:center;align-items:flex-end;margin-top:4px}
.plant::after{content:"";position:absolute;left:4%;right:4%;bottom:0;height:1px;background:currentColor;opacity:.16}
.plant svg{position:relative;height:100%;width:auto;max-width:100%;overflow:visible}
.plant svg.grow{transform-origin:50% 100%;animation:grow 1s cubic-bezier(.3,1.7,.5,1) .55s both}
.plant .drop{position:absolute;left:50%;top:0;width:26px;margin-left:-13px;animation:drop .75s ease-in forwards;z-index:3}
.plant .drop path{fill:var(--water)}
.sway{animation:sway 6s ease-in-out infinite}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .8s}

/* plant parts */
.p-pot{fill:var(--pot)} .p-rim{fill:var(--pot);filter:brightness(1.08)} .p-soil{fill:var(--soil)} .p-band{stroke:var(--surface);stroke-width:4;opacity:.25;fill:none}
.p-stem{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.p-leaf{fill:var(--accent)} .p-vein{fill:none;stroke:var(--accent);stroke-width:1.4;opacity:.55}
.p-pet{fill:var(--petal)} .p-pet2{fill:var(--petal2)} .p-ctr{fill:var(--gold-bright)} .p-seed{fill:var(--soil)} .p-spark{fill:var(--gold-bright)}

/* the one action */
.checkin{position:relative;width:100%;min-height:4.2rem;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:1.25rem;font-weight:700;line-height:1.3;box-shadow:0 8px 20px rgba(35,72,54,.22);display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 22px;text-align:left;transition:transform .12s}
.checkin:active{transform:scale(.98)}
.checkin .ic{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.checkin .ic svg{width:1rem}
.checkin .sub{display:block;font-size:.8rem;font-weight:400;opacity:.85}
.checkin[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.link-btn{align-self:center;background:none;border:0;padding:6px 0;min-height:44px;color:var(--muted);font-size:.9rem;text-decoration:underline;text-underline-offset:4px;text-align:center}

/* after the check-in: a quiet confirmation with the partner's words */
.donec{gap:14px}
.d-head{display:flex;align-items:center;gap:14px}
.d-check{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.d-check svg{width:1.3rem;height:1.3rem}
.d-check.new{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.done-t{font-size:1.2rem;line-height:1.35}
.d-pts{flex:none;align-self:flex-start;font-family:var(--f-num);font-size:1.35rem;line-height:1.2;color:var(--gold);text-align:center}
.d-pts small{display:block;font-family:var(--f-body);font-size:.7rem;line-height:1.2}
.donec .link-btn{margin:-6px 0 -8px}
.float{position:absolute;left:50%;top:-6px;font-weight:700;font-size:1.3rem;color:var(--gold);animation:floatUp 1.4s ease-out forwards;pointer-events:none;white-space:nowrap}
</style>
<style>
/* plant palette: sage leaves, a matte clay pot, dusty-pink flowers; flowers and pots keep their colour in dark mode */
:root{--leaf-a:#4C7A5B;--leaf-b:#8DB596;--stem:#5B8666;--pk0:#B9466A;--pk1:#D9677F;--pk2:#EE9EAF;--pk3:#FBE6EA;--cr0:#C0603F;--cr1:#DE8762;--cr2:#F1B394;--cr3:#FCEADF;--bl1:#5E8FC4;--bl2:#9BC0E3;--bl3:#E2EEF8;
  --pot-a:#D9A387;--pot-b:#C4876A;--pot-c:#A86C52;--glz-a:#D3E2D8;--glz-b:#A9C6B5;--glz-c:#83A693;--stamen:#A47718;--plant-shadow:rgba(31,43,36,.13);--hi:rgba(255,255,255,.16);--pot-bloom:rgba(255,255,255,.85)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--leaf-a:#5E9A72;--leaf-b:#9FCCA9;--stem:#6FA37E;--plant-shadow:rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--leaf-a:#5E9A72;--leaf-b:#9FCCA9;--stem:#6FA37E;--plant-shadow:rgba(0,0,0,.45)}
.p-stemf{fill:var(--stem)} .p-petiole{fill:none;stroke:var(--stem);stroke-width:1.6;stroke-linecap:round}
.p-vein{fill:none;stroke:var(--leaf-a);stroke-width:.9;opacity:.5}
.p-sepal{fill:var(--leaf-a)} .p-stamen{fill:var(--stamen)} .p-shadow{fill:var(--plant-shadow)}
.p-hi{fill:none;stroke:var(--hi);stroke-width:3.5;stroke-linecap:round} .p-pblm{fill:var(--pot-bloom)} .p-shine{fill:var(--hi)}
.p-goldline{stroke:var(--gold-bright);stroke-width:2} .p-body{fill:var(--ink)} .p-ground{fill:var(--accent-soft)} .p-fall{fill:var(--pk2)}
.hl{opacity:.55;animation:hlp 1.6s ease-in-out infinite alternate}
@keyframes hlp{from{opacity:.2}to{opacity:.75}}

/* cards: one quiet style; hierarchy comes from type, not colour */
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:1.1rem;line-height:1.4}
.eyebrow{font-size:.85rem;color:var(--muted)}
.btn{min-height:3rem;border-radius:999px;padding:8px 20px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.solid{background:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* morning picture */
.frame{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/5;width:100%;max-width:100%;background:var(--accent-soft)}
.frame img{display:block;width:100%;height:100%;object-fit:cover;-webkit-touch-callout:default;user-select:auto}
.frame img.reveal{animation:reveal .9s ease-out}
.blurimg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(18px) saturate(.9)}
.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
.lock .ring{width:3.4rem;height:3.4rem;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center}
.lock .ring svg{width:1.4rem;height:1.4rem}
.lock .pill{background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px;font-size:.9rem;font-weight:500}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.frame.teaser{aspect-ratio:16/9}

/* the partner's question sits inside the partner card */
.care{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.care .eyebrow{color:var(--muted)}
.care h3{font-size:1.08rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:3.2rem;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;padding:10px 16px;font-weight:500}
.opt:active,.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.reply{display:flex;gap:10px;align-items:flex-start}
.avatar{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.bubble{background:var(--paper);border-radius:4px 16px 16px 16px;padding:10px 14px;min-width:0}
.bubble b{display:block;font-size:.8rem;color:var(--muted)}

/* surprise card */
.prize{border-radius:24px;background:var(--surface);border:1px solid var(--line);padding:18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .45s ease-out}
.prize .p-big{font-family:var(--f-serif);font-weight:600;font-size:1.3rem;color:var(--ink);line-height:1.35}

/* records page */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .wd{font-size:.8rem;color:var(--muted)}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-size:.95rem}
.cal .d.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--gold-bright)}
.cal .d.pre{color:var(--line)}
.path{display:flex;flex-direction:column}
.stone{display:grid;grid-template-columns:3rem 1fr;gap:12px;align-items:center;position:relative;padding-bottom:14px}
.stone:not(:last-child)::before{content:"";position:absolute;left:1.45rem;top:3rem;bottom:0;width:2px;background:var(--line)}
.stone.got:not(:last-child)::before{background:var(--accent)}
.mini{width:3rem;height:3rem;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;overflow:hidden}
.mini svg{height:2.5rem;width:auto}
.stone.got .mini{border-color:var(--accent);background:var(--accent-soft)}
.stone.next .mini{border-color:var(--gold-bright)}
.mini.secret{font-family:var(--f-serif);font-size:1.2rem;color:var(--muted);border-style:dashed}
.stone h4{font-size:1.02rem;text-wrap:wrap}
.fsopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fsopt{min-height:5rem;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;font-weight:700}
.fsopt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.qa{display:flex;flex-direction:column;gap:10px}
.qa div{border-bottom:1px solid var(--line);padding-bottom:8px}
.qa div:last-child{border:0}

/* feelings */
.metric{display:flex;flex-direction:column;gap:6px}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.face{min-height:3.2rem;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0 5px;min-width:0}
.face .fw{font-size:.68rem;line-height:1.2;white-space:nowrap;font-weight:500}
.face svg,.fc{width:1.8rem;height:1.8rem;display:block}
.face[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;min-height:3rem}
textarea{min-height:5.5rem;resize:vertical}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem}
.legend span::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
.chart{width:100%;height:auto;display:block}
.note{font-size:.85rem;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}

/* page header on the records and feelings pages */
.phead{padding:10px 4px 2px}
.phead h1{font-size:1.6rem;line-height:1.3}
.phead p{color:var(--muted);font-size:.9rem;margin-top:2px}

/* nav, overlay, misc */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}

details.demo{border:1px dashed var(--line);border-radius:16px;padding:8px 14px;color:var(--muted);font-size:.85rem}
details.demo summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
footer.fine{font-size:.78rem;color:var(--muted);text-align:center;line-height:1.6;padding-top:4px}

@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}

<style>
/* ---------- play: watering, the pet and the plant that answer when touched, the surprise card, flowers from the partner ---------- */

.pet-j.jump.now{animation-delay:0s}

.say{position:absolute;z-index:4;width:max-content;max-width:min(17em,80%);padding:8px 13px 9px;border-radius:16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  box-shadow:0 6px 18px rgba(31,43,36,.14);font-size:.86rem;line-height:1.5;font-weight:500;text-align:center;word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance;
  opacity:0;transform:translateY(6px) scale(.94);transform-origin:var(--tx) 100%;transition:opacity .22s,transform .26s cubic-bezier(.3,1.4,.5,1);pointer-events:none}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fcard::after{opacity:.2}}
:root[data-theme="dark"] .fcard::after{opacity:.2}
.flip3d{perspective:1100px}
.f3{display:grid;transform-style:preserve-3d;animation:f3 .8s cubic-bezier(.45,.05,.25,1) both}
.f3>*{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f3>.prize{transform:rotateY(180deg);animation:none}
@keyframes f3{0%{transform:rotateY(0)}100%{transform:rotateY(180deg)}}
/* flowers from the partner: a vase on the sill, the flower drifting in, the note under the day-card */
.h-scene .vase{position:absolute;right:5.5%;bottom:11.6%;width:11%;padding:0;border:0;background:none;z-index:1;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.h-scene.has-vase .deco{left:calc(50% + 2rem);width:min(3.1rem,16vw)} /* festival things make room for the vase */
.vase svg{width:100%;height:auto;display:block;overflow:visible}
.vase.got{animation:got .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes got{0%{transform:scale(.82)}60%{transform:scale(1.12)}100%{transform:none}}
.fdrift{position:absolute;z-index:4;width:24px;height:24px;pointer-events:none;animation:fdrift 1.9s cubic-bezier(.45,.1,.55,1) both}
.fdrift svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes fdrift{0%{transform:translate(0,0) rotate(0) scale(.6);opacity:0}12%{opacity:1}35%{transform:translate(calc(var(--dx)*.25 - 14px),calc(var(--dy)*.3)) rotate(-40deg) scale(1)}
  65%{transform:translate(calc(var(--dx)*.62 + 10px),calc(var(--dy)*.66)) rotate(30deg) scale(1)}100%{transform:translate(var(--dx),var(--dy)) rotate(0) scale(.7);opacity:.2}}
.flwc{gap:12px;border:1.5px solid rgba(217,103,127,.35)}
.flw-ic{flex:none;width:2.8rem;height:2.8rem;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;overflow:hidden}
.flw-ic svg{width:60%;height:auto;margin-top:8%}
.flwc .row .btn{flex:1 1 auto}
.h-foot>span{word-break:keep-all;overflow-wrap:anywhere}
.team{display:flex;align-items:center;gap:8px;color:var(--muted);margin-top:-4px}
.team .ri{flex:none;width:.85rem;height:1.1rem;color:var(--water)}
.team .ri svg{width:100%;height:100%;display:block}
</style>
<style>
/* ---------- the 30-day challenge: a warm gold card, her 30 days as a calendar, the sign-up question ---------- */
.chalc{border:1.5px solid rgba(201,166,89,.55);background:var(--gold-soft)}
.chalc .ch-eb{color:var(--gold);font-weight:700;letter-spacing:.02em}
.chalc .row-b .ch-eb{margin:0}
.chalc .tag{background:var(--surface);color:var(--gold)}
.ch-t{font-family:var(--f-serif);font-weight:600;font-size:1.25rem;line-height:1.4;margin-top:-4px}
.ch-t b,.ch-say b{font-family:var(--f-num);font-weight:400;font-size:1.45em;color:var(--gold);padding:0 2px}
.ch-when{display:flex;align-items:center;gap:14px;margin-top:-2px}
.ch-num{font-family:var(--f-num);font-size:3.6rem;line-height:1;color:var(--gold)}
.ch-wt{font-family:var(--f-serif);font-weight:600;font-size:1.2rem;line-height:1.35}
.ch-wt small{display:block;font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--muted);margin-top:2px}
.ch-rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:r}
.ch-rules li{counter-increment:r;display:flex;gap:10px;align-items:flex-start;line-height:1.5;font-weight:500}
.ch-rules li::before{content:counter(r);flex:none;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--surface);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:.85rem;margin-top:.05em}
.ccal{gap:5px;background:var(--surface);border-radius:18px;padding:10px 8px}
.ccal .d{font-size:.9rem}
.ccal .d.fut{color:var(--muted);opacity:.55}
.ch-range{margin-top:-4px;text-align:center}
.ch-say{font-family:var(--f-serif);font-weight:600;font-size:1.05rem;line-height:1.5;text-align:center;text-wrap:balance}
.ch-say.ok{color:var(--accent)}
.ch-say span,.ch-range span{display:inline-block}
.chalc .btn{align-self:stretch}
.btn .bi{flex:none;width:1.2rem;height:1.2rem;margin-right:8px;display:block}
.btn .bi svg{width:100%;height:100%;display:block}
/* yes / not yet, side by side */
.nutpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nutpick .plc{justify-content:center;text-align:center;min-height:3.6rem}
.nutrow{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
.nutrow h4{font-size:1rem;line-height:1.4}
</style>
<style>
/* ---------- motion: pages slide in, new cards rise, pop-ups open and close softly; the windowsill rests when nobody is looking ---------- */
#app.enter>*{animation:enter .46s cubic-bezier(.2,.8,.25,1) both}
#app.enter>*:nth-child(2){animation-delay:.05s}
#app.enter>*:nth-child(3){animation-delay:.1s}
#app.enter>*:nth-child(4){animation-delay:.15s}
#app.enter>*:nth-child(n+5){animation-delay:.2s}
@keyframes enter{from{opacity:0;transform:translateY(16px)}}
#app>.pop-in{animation:popIn .5s cubic-bezier(.2,.9,.3,1.05) both}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
#overlay.in{animation:ovIn .26s ease-out both}
#overlay.in>*{animation:boxIn .42s cubic-bezier(.2,1.1,.35,1) both}
#overlay.out{animation:ovOut .19s ease-in both}
#overlay.out>*{animation:boxOut .19s ease-in both}
@keyframes ovIn{from{opacity:0}}
@keyframes ovOut{to{opacity:0}}
@keyframes boxIn{from{opacity:0;transform:translateY(28px) scale(.96)}}
@keyframes boxOut{to{opacity:0;transform:translateY(14px) scale(.98)}}
/* pressing feels like pressing */
.btn,.opt,.plc,.task,.rowi,.fp{transition:transform .14s ease,background-color .2s,border-color .2s}
.btn:active,.opt:active,.plc:active,.task:active,.rowi:active,.fp:active{transform:scale(.97)}
nav.tabs button{transition:background-color .25s ease,color .25s ease}
nav.tabs button[aria-current="page"] svg{animation:tabPop .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes tabPop{40%{transform:scale(1.18)}}
/* the windowsill rests when it is out of sight or nobody has touched the page for a while */
.h-scene.hz *{animation-play-state:paused!important}
/* only the plant, the pet and the vase take taps; the drawings around them are skipped when a finger lands */
.h-scene svg{pointer-events:none}
.h-scene .ptap,.h-scene .vase{pointer-events:auto}
@media (prefers-reduced-motion:reduce){#app.enter>*,#app>.pop-in,#overlay.in,#overlay.in>*,#overlay.out,#overlay.out>*,nav.tabs button svg{animation:none!important}}
</style>
<style>
/* ---------- first visit: the invitation (one warm hero, short cards, the button twice) and the five steps ---------- */
.j-hero{gap:10px;padding-bottom:18px}
.j-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.j-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:999px;background:var(--surface);color:var(--ink);font-weight:700;font-size:.8rem;box-shadow:0 2px 8px var(--shadow);min-width:0}
.j-badge svg{width:1rem;height:1rem;flex:none;color:#D9677F;fill:#F5C6D0}
.fsmini{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.6);font-size:.72rem;flex:none}
.fsmini>span{padding:0 4px 0 7px;color:var(--muted);font-weight:600}
.fsmini button{border:0;background:none;color:var(--muted);font:inherit;font-weight:700;min-width:1.9rem;height:1.9rem;border-radius:999px;cursor:pointer}
.fsmini button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px var(--shadow)}
.j-title{font-size:1.95rem;line-height:1.22;font-weight:800;letter-spacing:.01em;color:var(--t-ink);margin-top:6px}
.j-title span{display:inline-block}
.j-when{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-weight:600;font-size:.95rem;color:var(--t-ink)}
.j-when>span:first-child{opacity:.8}
.j-soon{display:inline-flex;align-items:baseline;gap:3px;padding:3px 11px;border-radius:999px;background:var(--surface);color:var(--gold);font-weight:700;font-size:.85rem;box-shadow:0 2px 8px var(--shadow)}
.j-soon b{font-family:var(--f-num);font-weight:400;font-size:1.25rem;line-height:1}
.j-scene{margin-top:2px}
.j-pet{position:absolute;left:5%;bottom:9.4%;width:calc(min(5.6rem,29vw)*.92);z-index:2;pointer-events:none}
.j-pet svg{width:100%;height:auto;display:block}
.j-tags{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.j-tags span{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;padding:5px 10px 5px 7px;font-size:.78rem;font-weight:700;color:var(--accent)}
.j-tags svg{width:.95rem;height:.95rem}
.j-hero .j-go{margin-top:4px}
.j-go>span,.j-step .checkin>span{text-align:center}
.j-card{display:flex;flex-direction:column;gap:14px}
.j-h{font-size:1.2rem;line-height:1.35;font-weight:800}
.j-row{display:flex;align-items:center;gap:12px}
.j-row b{display:block;font-size:1rem;line-height:1.4}
.j-row small{display:block;color:var(--muted);font-size:.82rem;line-height:1.45;margin-top:1px}
.j-ic{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.j-ic svg{width:1.3rem;height:1.3rem}
.j-ic.g{background:#E3EEF7;color:#3F7DB0}
.j-ic.y{background:var(--gold-soft);color:var(--gold)}
.j-ic.p{background:#FBE7EC;color:#C8566F}
.j-ic.j-pt{background:var(--gold-soft);overflow:hidden}
.j-ic.j-pt svg{width:2.3rem;height:auto;margin-top:6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .j-ic.g{background:#1D2A33;color:#8FBCE0}:root:not([data-theme="light"]) .j-ic.p{background:#33222A;color:#F0A3B6}}
:root[data-theme="dark"] .j-ic.g{background:#1D2A33;color:#8FBCE0}
:root[data-theme="dark"] .j-ic.p{background:#33222A;color:#F0A3B6}
/* growth: day 1, day 10, day 30 */
.j-grow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:end;gap:2px;background:var(--paper);border-radius:18px;padding:12px 8px 8px}
.jg{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.jg-p{height:6.2rem;width:100%}
.jg-p svg{height:100%;width:100%;display:block}
.jg figcaption{font-size:.75rem;font-weight:700;color:var(--muted)}
.jg-ar{color:var(--gold-bright);font-size:1.3rem;font-weight:700;padding-bottom:1.6rem}
/* the prize: a little paper certificate beside the words */
.j-pz{display:grid;grid-template-columns:42% 1fr;gap:14px;align-items:center}
.j-pzt{display:flex;flex-direction:column;gap:10px}
.j-pzt p{font-size:.88rem;line-height:1.5;color:var(--muted)}
.j-pzt b{color:var(--ink);font-size:1rem}
.mcert{background:#FBF7EE;border-radius:6px;padding:5px;box-shadow:0 6px 16px rgba(60,45,20,.16);transform:rotate(-3deg);color:#2E2A22}
.mc-in{position:relative;border:2px solid #C9A659;outline:1px solid #C9A659;outline-offset:-5px;border-radius:3px;padding:10px 6px 26px;text-align:center}
.mc-eb{font-size:.5rem;letter-spacing:.2em;color:#B08A3E;font-weight:700}
.mc-t{font-size:.62rem;font-weight:800;margin-top:2px;line-height:1.3}
.mc-p{height:3.6rem;display:flex;justify-content:center;margin:4px 0 2px}
.mc-p svg{height:100%;width:auto}
.mc-n{font-size:.78rem;font-weight:800;border-bottom:1px dashed #C9A659;display:inline-block;padding:0 6px}
.mc-l{font-size:.5rem;margin-top:4px;opacity:.75}
.mc-seal{position:absolute;right:7px;bottom:5px;width:1.5rem;height:1.5rem;border-radius:50%;border:2px solid #C2483B;color:#C2483B;font-size:.48rem;font-weight:800;display:grid;place-items:center;transform:rotate(-12deg)}
.j-faq>div{border-top:1px solid var(--line);padding-top:10px}
.j-faq>div:first-of-type{border-top:0;padding-top:0}
.j-faq b{font-size:.98rem}
.j-faq p{color:var(--muted);font-size:.9rem;line-height:1.55;margin-top:2px}
.j-end{margin:6px 0 10px}
/* the steps */
.j-step{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.j-steps{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px 0 4px}
.j-back{padding:6px 0;font-weight:700}
.j-dots{display:flex;gap:6px}
.j-dots i{width:.55rem;height:.55rem;border-radius:50%;background:var(--line);transition:background-color .3s,transform .3s}
.j-dots i.on{background:var(--accent)}
.j-dots i.on:last-of-type{transform:scale(1.25)}
.j-of{font-size:.8rem;color:var(--muted);font-weight:700;min-width:2.6rem;text-align:right}
.j-q{font-size:1.45rem;line-height:1.35;font-weight:800}
.j-step input[type=text]{font-size:1.15rem}
.j-next{margin-top:6px}
.j-err{color:#C2483B;font-weight:700;margin-top:-6px}
.shake{animation:shake .42s ease}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.j-sub{display:flex;flex-direction:column;gap:8px}
.j-sub h3{font-size:1.05rem}
.j-ok{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border-radius:16px;padding:12px;font-size:.9rem;line-height:1.55}
.j-ok input{width:1.6rem;height:1.6rem;flex:none;margin-top:2px;accent-color:var(--accent)}
@media (max-width:350px){.j-title{font-size:1.65rem}.j-pz{grid-template-columns:1fr}.mcert{max-width:12rem;margin:0 auto}}
</style>

/* ---------- pet behaviour: stays beside the pot; sits, looks around, waves, grooms, lies down, stretches, takes a few slow steps ---------- */
let PET={x:null,face:1,t:0,bx:null,woke:false};
function petPose(pose,cls){const el=$('#petw'),pin=$('#petin');if(!el||!pin)return;pin.innerHTML=petSVG(S.pet,+el.dataset.stage,el.dataset.cos||'',pose,S.fur);pin.className='pet-in'+(PET.face<0?' mirror':'')+(cls?' '+cls:'')}
function petMove(el,x,dur,ease){el.style.transition=dur?`transform ${dur.toFixed(2)}s ${ease||'linear'}`:'none';el.style.transform=`translateX(${Math.round(x)}px)`}
function petStart(){
  clearTimeout(PET.t);const el=$('#petw');if(!el)return;
  const W=el.parentElement.clientWidth,w=el.offsetWidth,sv=el.parentElement.querySelector('svg'),pot=sv?sv.getBoundingClientRect().width*.22:40,minX=-w*.06,maxX=Math.max(minX,W-w*.94),home=Math.max(minX,Math.min(maxX,W/2-pot-w*.8));
  const awake=el.dataset.mode==='awake',gentle=calm();
  if(PET.x==null||!awake)PET.x=home;
  PET.x=Math.max(minX,Math.min(maxX,PET.x));petMove(el,PET.x,0);el.style.opacity=1;
  if(awake&&PET.face<0)$('#petin').classList.add('mirror');
  const ball=$('#ball');
  if(ball){if(PET.bx==null)PET.bx=Math.min(W-28,W/2+44);ball.style.transition='none';ball.style.transform=`translateX(${Math.round(PET.bx)}px)`}
  if(!awake)return;
  const rest=(p,ms)=>{petPose(p,'');PET.t=setTimeout(step,ms)};
  const go=(tx,run,after)=>{tx=Math.max(minX,Math.min(maxX,tx));const d=Math.abs(tx-PET.x);if(d<20){after();return}
    if(gentle)run=false;PET.face=tx>PET.x?1:-1;petPose(run?'run':'walk','');
    const dur=d/(run?85+Math.random()*20:26+Math.random()*10);
    petMove(el,tx,dur,run?'cubic-bezier(.3,.6,.35,1)':'cubic-bezier(.4,.1,.6,.9)');PET.x=tx;PET.t=setTimeout(after,dur*1000+80)};
  function step(){
    if(!document.body.contains(el))return;
    const r=Math.random(),st=+el.dataset.stage;
    if(ball&&!gentle&&r<.2)go(PET.bx-w*.55,true,()=>{const nb=8+Math.random()*(W-40);PET.bx=nb;ball.style.transition='transform 1.4s cubic-bezier(.2,.7,.3,1)';ball.style.transform=`translateX(${Math.round(nb)}px)`;rest('sit',1000)});
    else if(r<.4)go(Math.max(minX,home-w*.7)+Math.random()*w*.85,false,()=>rest(Math.random()<.5?'sit':'look',2200+Math.random()*2200));
    else if(r<.62)rest(st>=4&&Math.random()<.4?'wave':'sit',3200+Math.random()*2800);
    else if(r<.79)rest('look',1800+Math.random()*1400);
    else if(r<.89)rest('lie',3200+Math.random()*3000);
    else if(r<.96)rest('groom',2200+Math.random()*1400);
    else rest('stretch',1700);
  }
  if(PET.woke){PET.woke=false;PET.t=setTimeout(()=>rest('stretch',1800),1200)}else rest('sit',1200);
}

  addEventListener('online',()=>{if(syncFlag()!=='ok')cloudSave(true)});
  if(await cloudRestore())return;
  if(await cloudMoveIn())return;
  if(!STANDALONE&&MOVE&&!S.onboarded)setURL(null);
  cloudPartner();cloudFlowers();
  if(S.onboarded&&!moved()&&syncFlag()!=='ok')cloudSave(true);
  else{cloudMoveCode();cloudCheckMoved()}
}

const hx=h=>{h=h.replace('#','');if(h.length===3)h=h.replace(/./g,c=>c+c);return [0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const mixHex=(a,b,t)=>{const A=hx(a),B=hx(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};

function scenePal(p){
  const th=dayTheme(),dim=p==='night'||isDark(),base=p==='dusk'?mixHex(th.bg,'#F2CBB0',.32):th.bg;
  const wall=dim?mixHex(base,'#1B2134',p==='night'?.8:.74):base;
  return {wall,reveal:mixHex(wall,dim?'#0B0F1C':'#9C9183',dim?.28:.13),ink:dim?'#EEF0F5':th.ink,frame:dim?'#9DA3B8':'#FCFAF6',
    sillT:dim?'#5B617A':'#F2EBE0',sillF:dim?'#464B62':'#DDD1BF',curtain:dim?mixHex(th.deep,'#1B2134',.55):th.deep,acc:th.acc,dim};
}

function hero(act){
  const n=count(),m=nextMile(),prev=[...MILES].reverse().find(x=>n>=x.n),base=prev?prev.n:0;
  const pct=m?Math.round((n-base)/(m.n-base)*100):100,doneT=!!S.checks[today()]&&n>0,pc=costume();
  const now=RIT?' now':'',cap=doneT?`<p class="h-cap${justChecked?' new'+now:''}">${grow(n).label}</p>`:`<p class="h-cap mute${act?' pre':''}">${n?'今天浇水后，花会有新的变化':'浇第一次水，种子就会发芽'}</p>`;
  const drop=justChecked&&!RIT&&!calm()?`<svg class="drop" viewBox="0 0 24 32" aria-hidden="true"><path d="M12 1S2 13.5 2 20.5a10 10 0 0 0 20 0C22 13.5 12 1 12 1z"/></svg>`:'';
  const p=period(),c=scenePal(p),deco=itemDeco(pc),vase=vaseMarkup(c);
  /* the plant and the pet are buttons: touched, they answer */
  return `<section class="hero" style="${heroStyle(p)}">
    <div class="h-top">${dateBlock()}<div class="h-pts" id="pts" aria-label="积分 ${S.points}">积分<b>${S.points}</b></div></div>
    <h1 class="h-greet">${esc(S.name)}，${greetWord()}</h1>${pc.label?`<p class="h-fest">${esc(pc.label)}</p>`:''}
    <div class="h-scene${vase?' has-vase':''}">${roomSVG(p,c)}<div class="plant" id="plant" style="height:${f1((260-vbY0(grow(n)))/260*76)}%"><button class="ptap" data-act="plantpat" aria-label="看看我的花">${plantSVG(n,{cls:justChecked?'grow'+now:'',hl:doneT})}</button>${drop}${deco}${S.hidePet?'':petMarkup(n,pc,doneT)}</div>${deco||vase?'':cupSVG(p,c)}${vase}</div>
    ${cap}${act||''}
    <div class="h-foot">${m?`<div class="row-b"><span>累计 <b${justChecked&&!calm()?' class="roll"':''}>${n}</b> 天</span><span>再 <b>${m.n-n}</b> 天${m.stage}</span></div>
      <div class="bar" role="progressbar" aria-label="离下一份礼物" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.max(pct,3)}%"></i></div>

  </section>`;
}

const FACE_D=['M8.2 16.7c1.1-1.5 2.4-2.2 3.8-2.2s2.7.7 3.8 2.2','M8.7 16.1c.9-.9 2-1.3 3.3-1.3s2.4.4 3.3 1.3','M8.9 15.4h6.2','M8.7 14.3c.9 1 2 1.5 3.3 1.5s2.4-.5 3.3-1.5','M8.1 13.7c1.1 1.9 2.4 2.8 3.9 2.8s2.8-.9 3.9-2.8'];
const faceIn=v=>`<circle cx="12" cy="12" r="9.2"/><circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"/><path d="${FACE_D[v-1]}"/>`;
const faceSVG=v=>`<svg class="fc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">${faceIn(v)}</svg>`;
/* the five faces look alike at a glance, so each one carries a word */
const FACE_W=['很差','不太好','一般','不错','很好'];
function chart(){

  const W=320,H=170,L=30,R=14,T=12,B=30,xs=i=>F.length===1?(L+W-R)/2:L+i*(W-L-R)/(F.length-1),ys=v=>T+(5-v)*(H-T-B)/4;
  const ser=FSER.filter(([k])=>F.some(f=>f[k]));let g='';

  const lines=ser.map(([k,,c],j)=>{const dy=(j-(ser.length-1)/2)*3.6,P=F.map((f,i)=>f[k]?[xs(i),ys(f[k])+dy,i]:null).filter(Boolean);
    return `<polyline style="fill:none;stroke:${c};stroke-width:3;stroke-linejoin:round;stroke-linecap:round" points="${P.map(p=>p[0]+','+p[1]).join(' ')}"/>`+
      P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]===F.length-1?5.5:4.5}" style="fill:${c};stroke:var(--surface);stroke-width:2"/>`).join('')}).join('');

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="感觉变化图">${g}${lines}${lab}</svg>

    ${F.length<2?'<p class="note">每个星期记录一次，就能看到自己的变化。</p>':''}
    <details class="rows"><summary>看全部记录</summary><table class="rtab"><tr><th>日期</th>${ser.map(([,l])=>`<th>${l}</th>`).join('')}</tr>
      ${F.slice().reverse().map(f=>`<tr><td>${esc(f.d.slice(5).replace('-','/'))}</td>${ser.map(([k])=>`<td>${f[k]?faceSVG(f[k])+f[k]:'–'}</td>`).join('')}</tr>`).join('')}</table></details>`;

/* weekly weight, only if she chose to fill it in */
function kgCard(){

  const W=320,H=150,L=22,Rr=22,T=30,B=30,v=R.map(r=>r.kg),lo=Math.min(...v),hi=Math.max(...v),pad=Math.max(1,(hi-lo)*.3),y0=lo-pad,y1=hi+pad;
  const xs=i=>R.length===1?W/2:L+i*(W-L-Rr)/(R.length-1),ys=x=>T+(y1-x)*(H-T-B)/(y1-y0),n=R.length-1,d=R[n].kg-R[0].kg;
  const pts=R.map((r,i)=>[xs(i),ys(r.kg)]);
  const lbl=(i,anchor)=>`<text x="${pts[i][0]}" y="${pts[i][1]-12}" font-size="14" font-weight="700" text-anchor="${anchor}" style="fill:var(--ink)">${kgFmt(R[i].kg)}</text>`;

const samePet=(f,t)=>['mode','stage','cos','k'].every(k=>f.dataset[k]===t.dataset[k])&&f.style.getPropertyValue('--ps')===t.style.getPropertyValue('--ps')
  &&((f.querySelector('.pet-j')||{}).className===(t.querySelector('.pet-j')||{}).className);
function paint(app,html,key){
  const swap=key!==VIEW,first=!VIEW;VIEW=key;
  if(swap||typeof morphdom!=='function'){if(swap)clearTimeout(PET.t);app.innerHTML=html;if(swap&&!first)enter(app);return}
  morphdom(app,'<div>'+html+'</div>',{childrenOnly:true,
    onBeforeElUpdated(f,t){
      if(f.classList&&f.classList.contains('hz'))t.classList.add('hz');
      if(f.isEqualNode(t))return false;
      /* what she is typing stays where it is */
      if(f===document.activeElement&&(f.tagName==='TEXTAREA'||(f.tagName==='INPUT'&&f.type!=='checkbox')))return false;
      /* a pet that looks the same keeps walking where it is */
      if(f.id==='petw'&&samePet(f,t))return false;
      return true},
    onElUpdated(el){if(el.id==='petw')el._live=0},
    onBeforeNodeDiscarded(n){return !(n.nodeType===1&&n.classList&&FX_KEEP.some(c=>n.classList.contains(c)))},
    onNodeAdded(n){if(n.nodeType===1&&n.parentNode===app&&!calm()){n.classList.add('pop-in');setTimeout(()=>{if(n.classList)n.classList.remove('pop-in')},800)}return n}});
}
function enter(app){if(calm())return;app.classList.remove('enter');void app.offsetWidth;app.classList.add('enter');clearTimeout(ENT);ENT=setTimeout(()=>app.classList.remove('enter'),1000)}
/* pop-ups: they rise in when shown (whoever shows them), and fade down before hiding */
function ovHide(after){const o=$('#overlay'),done=()=>{o.hidden=true;o.classList.remove('out','in');if(after)after()};
  if(o.hidden){if(after)after();return}
  if(calm()){done();return}
  o.classList.remove('in');o.classList.add('out');setTimeout(done,190)}
(function(){const o=$('#overlay');if(!o||!('MutationObserver' in window))return;
  new MutationObserver(()=>{if(!o.hidden&&!o.classList.contains('out')){o.classList.remove('in');void o.offsetWidth;o.classList.add('in')}}).observe(o,{attributes:true,attributeFilter:['hidden']})})();

const HL={io:null,el:null,vis:true,until:0,on:null,t:0};
function heroWatch(){const el=$('.h-scene');
  if(el!==HL.el){HL.el=el;HL.on=null;if(HL.io){HL.io.disconnect();HL.io=null}HL.vis=true;
    if(el&&'IntersectionObserver' in window){HL.io=new IntersectionObserver(es=>{HL.vis=es[es.length-1].isIntersecting;if(HL.vis)wake();else heroLive()});HL.io.observe(el)}
    wake()}
  else heroLive()}
function heroLive(){const el=HL.el;if(!el||!el.isConnected)return;const on=HL.vis&&!document.hidden&&Date.now()<HL.until;if(on===HL.on)return;HL.on=on;
  el.classList.toggle('hz',!on);el.querySelectorAll('svg').forEach(s=>{try{on?s.unpauseAnimations():s.pauseAnimations()}catch(e){}})}
function wake(){HL.until=Date.now()+15000;heroLive();clearTimeout(HL.t);HL.t=setTimeout(heroLive,15050)}
addEventListener('pointerdown',wake,{passive:true});addEventListener('keydown',wake);
addEventListener('scroll',()=>{if(HL.on===false&&HL.vis)wake()},{passive:true});

function confetti(){

  const c=$('#fx'),x=c.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight;
  c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);c.hidden=false;
  const cs=getComputedStyle(document.documentElement),cols=['--pk2','--pk1','--cr2','--pk3','--leaf-b'].map(v=>cs.getPropertyValue(v).trim()||'#EE9EAF');
  const P=Array.from({length:28},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,vy:1.2+Math.random()*1.4,sw:Math.random()*6.28,r:5+Math.random()*5,c:cols[Math.random()*cols.length|0],a:Math.random()*6.28,va:(Math.random()-.5)*.06}));
  let f=0;(function step(){if(run!==FXN)return;x.clearRect(0,0,W,H);
    P.forEach(p=>{p.y+=p.vy;p.sw+=.03;p.a+=p.va;x.save();x.translate(p.x+Math.sin(p.sw)*18,p.y);x.rotate(p.a);x.globalAlpha=.9;x.fillStyle=p.c;
      x.beginPath();x.ellipse(0,0,p.r,p.r*.55,0,0,Math.PI*2);x.fill();x.restore()});
    if(++f<230)requestAnimationFrame(step);else{x.clearRect(0,0,W,H);c.hidden=true}})();
}

  if(b.dataset.plan){const k=b.dataset.plan;if(!PLANS[k])return;
    if(!S.onboarded){keepName();draftPlan=k;render();if(obStep===4)jAuto(4);return}
    if(planOf(S)!==k){S.plan=k;S.planD=t;draft={e:0,s:0,g:0,sk:0,kg:''};save();toast('已换成「'+PLANS[k].name+'」计划')}
    render();return}
  if('nut' in b.dataset){const v=b.dataset.nut==='1';
    if(!S.onboarded){keepName();draftNut=v;render();if(obStep===2)jAuto(2);return}
    if(isNu(S)===v){S.nut=v;save();toast(v?'打卡按钮改成「我今天吃了营养」':'打卡按钮改成「我喝了今天第一杯水」')}
    render();return}
  if(b.dataset.task){const id=b.dataset.task,L=((S.tasks||(S.tasks={}))[t]||[]).slice(),i=L.indexOf(id);
    if(i>=0){L.splice(i,1);S.points=Math.max(0,S.points-2)}else{L.push(id);S.points+=2;justTask=id}
    if(L.length)S.tasks[t]=L;else delete S.tasks[t];
    save();render();justTask='';bumpPts();return}
  if(b.dataset.anchor){keepName();draftAnchor=b.dataset.anchor;render();return}
  switch(a){
    case 'check':if(!S.checks[t])water();break;
    case 'pat':patPet();break;
    case 'plantpat':patPlant();break;
    case 'vase':vaseSay();break;
    case 'flwok':S.flwHide=t;save();render();break;
    case 'flwdemo':{const id=Math.max(0,...(S.flw||[]).map(f=>+f.id||0))+1,M=['坚持得真好！','今天也很棒，继续加油！','为你的坚持骄傲！'];
      S.flw=[{id,f:S.partner,m:(S.name?S.name+'，':'')+M[id%M.length],d:t}].concat(S.flw||[]).slice(0,20);S.flwHide='';
      tab='today';save();render();scrollTo(0,0);break}
    case 'makeup':S.checks[add(t,-1)]=1;S.points+=5;justChecked=true;save();afterWater(false);break;
    case 'fast':{if(S.checks[t])S.offset=(S.offset||0)+1;
      for(let i=0;i<7;i++){S.checks[today()]=1;S.points+=10;if(i<6)S.offset=(S.offset||0)+1}
      justChecked=true;tab='today';save();scrollTo(0,0);afterWater(false);break}
    case 'jump':{const m=nextMile();if(!m)break;
      while(count()<m.n){if(S.checks[today()])S.offset=(S.offset||0)+1;S.checks[today()]=1;S.points+=10}
      justChecked=true;tab='today';save();scrollTo(0,0);afterWater(false);break}
    case 'flip':{const r=hash(t+S.name)%100,won=Object.keys(S.flips).some(d=>S.flips[d].type==='gift'&&diff(d,t)>=0&&diff(d,t)<30);
      /* stage 1 gifts and blessings; stage 2 fewer gifts, facts and quizzes; stage 3 no random gifts */
      const stg=stageOf(count()),G=[6,3,0][stg-1],P=[36,28,20][stg-1];let f;
      if(r<G&&!won)f={type:'gift'};else if(r<P){f={type:'pts'};S.points+=5}
      else if(stg===1)f={type:'bless',text:BLESS[hash(t)%BLESS.length]};
      /* facts and quizzes alternate between everyday ones and ones for her plan */
      else if(r<(P+100)/2){const pk=planOf(S),pt=PLAN_TXT[pk];
        if(pt&&((S.factN||0)+(S.pfactN||0))%2){f={type:'fact',p:pk,i:(S.pfactN||0)%pt.facts.length};S.pfactN=(S.pfactN||0)+1}
        else{f={type:'fact',i:(S.factN||0)%FACTS.length};S.factN=(S.factN||0)+1}}
      else{const pk=planOf(S),pt=PLAN_TXT[pk];
        if(pt&&((S.quizN||0)+(S.pquizN||0))%2){f={type:'quiz',p:pk,i:(S.pquizN||0)%pt.quiz.length,ans:null};S.pquizN=(S.pquizN||0)+1}
        else{f={type:'quiz',i:(S.quizN||0)%QUIZ.length,ans:null};S.quizN=(S.quizN||0)+1}}
      S.flips[t]=f;save();justFlip=true;render();justFlip=false;buzz(10);
      const w=calm()?0:650;setTimeout(()=>{if(f.type==='gift'||f.type==='pts')bumpPts();if(f.type==='gift')confetti()},w);break}
    case 'feel':{if(!feelReady())return;const pk=planOf(S),rec={d:t,day:dayNum(),e:draft.e,s:draft.s,g:draft.g};
      if(pk==='skin')rec.sk=draft.sk;
      if(pk==='weight'){const raw=String(draft.kg||'').trim().replace(/[,，。]/g,'.');
        if(raw){const v=parseFloat(raw);if(!/^\d{2,3}(\.\d{1,2})?$/.test(raw)||!(v>=25&&v<=250)){const er=$('#kgerr');if(er)er.hidden=false;const k=$('#kg');if(k)k.focus();return}rec.kg=Math.round(v*10)/10}}
      S.feel.push(rec);draft={e:0,s:0,g:0,sk:0,kg:''};S.points+=10;save();render();break}
    case 'ask':{const v=$('#q').value.trim();if(!v)return;S.questions.unshift({day:dayNum(),text:v});save();render();break}
    case 'a2hs':S.a2hs=true;save();render();break;
    case 'pettoggle':S.hidePet=!S.hidePet;save();render();toast(S.hidePet?'「今天」页不再显示宠物':'「今天」页会显示宠物');break;
    case 'rename':{const v=($('#pn2')||{}).value;if(v&&v.trim()){S.petName=v.trim().slice(0,8);save();render()}break}
    case 'cos':demoCos=demoCos+1>=DEMO_COS.length?-1:demoCos+1;render();break;
    case 'cosoff':demoCos=-1;render();break;
    case 'close':ovHide(()=>{if(!chalCheck())toDone()});break;
    /* sign-up: the invitation's button, next and back */
    case 'obgo':obStep=1;render();scrollTo(0,0);break;
    case 'obnext':keepName();
      if(obStep===1&&!draftName.trim()){const er=$('#nmerr'),n=$('#nm');if(er)er.hidden=false;if(n){n.focus();n.classList.remove('shake');void n.offsetWidth;n.classList.add('shake')}break}
      obStep=Math.min(OB_N,obStep+1);render();scrollTo(0,0);break;
    case 'obback':keepName();obStep=Math.max(0,obStep-1);render();scrollTo(0,0);break;
    case 'cert':showCert(false);break;
    /* demo: the same customer on a sign-up-week day, on challenge day 10, and the day her 25th check-in is due */
    case 'chpre':case 'chon':case 'chdone':{
      const sim=a==='chpre'?add(CHAL.open,2):a==='chon'?add(CHAL.start,9):add(CHAL.start,25),st=add(CHAL.open,-10),fs=S.fs;
      S=seed();S.fs=fs;S.offset=diff(ymd(new Date()),sim);S.start=st;S.planD=st;S.checks={};S.tasks={};S.answers={};S.flips={};S.flw=[];S.chalSeen='';
      for(let d=st;d<sim;d=add(d,1)){if(d===add(CHAL.start,3))continue;S.checks[d]=1;if(d>=CHAL.start)S.tasks[d]=diff(CHAL.start,d)%3?['water','move']:['water']}
      S.gifts={};MILES.forEach(m=>{if(count()>=m.n)S.gifts[m.id]=st});S.seen=['s1','s2','s3','s4','st2','st3'];
      tab='today';save();render();scrollTo(0,0);break}
    case 'chfriend':{const fs=S.fs;S=fresh();S.fs=fs;S.offset=diff(ymd(new Date()),add(CHAL.open,3));S.refQ='chenjie';REFX='chenjie';
      draftNut=false;obStep=0;draftName='';draftAnchor='';draftOk=false;draftPet='cat';draftFur='';draftPetName='招财';draftBM='';draftBD='';draftPlan='base';tab='today';save();render();scrollTo(0,0);break}
    case 'nclose':ovHide();break;
    case 'delme':cloudDelete();break;
    case 'month':showMonth(b.dataset.k);break;
    case 'mimg':showMorning();break;
    case 'month1':{const st=add(ymd(new Date()),-32);S.offset=0;S.start=st;S.checks={};S.tasks={};S.seenM=[];
      for(let i=0;i<32;i++){const d=add(st,i);if(i%6!==4)S.checks[d]=1;if(i%3)S.tasks[d]=['water',i%2?'move':'meal']}
      S.feel=[{d:st,day:1,e:2,s:3,g:3,kg:68.5},{d:add(st,8),day:9,e:3,s:3,g:3},{d:add(st,22),day:23,e:4,s:3,g:4,kg:67.6},{d:add(st,29),day:30,e:4,s:4,g:4,kg:67.2}];
      S.gifts={m1:st,m7:add(st,7),m21:add(st,20),m30:add(st,28)};save();tab='today';render();scrollTo(0,0);showMonth(1);break}
    case 'news':{const id=b.dataset.nid,x=newsList().find(n=>n.id===id)||[newsNow().card].find(n=>n&&n.id===id);showNews(x);break}
    case 'newsdemo':showNews(newsNow().card||demoNews()[2]);break;
    case 'next':S.offset=(S.offset||0)+1;save();render();scrollTo(0,0);break;
    case 'prev':if(diff(S.start,add(t,-1))>=0){S.offset=(S.offset||0)-1;save();render()}break;
    case 'new':{const fs=S.fs;S=fresh();S.fs=fs;REFX='';draftNut=true;obStep=0;draftName='';draftAnchor='';draftOk=false;draftPet='cat';draftFur='';draftPetName='招财';draftBM='';draftBD='';draftPlan=PLANQ||'base';tab='today';save();render();scrollTo(0,0);break}
    case 'sample':S=seed();tab='today';save();render();scrollTo(0,0);break;
    case 'start':keepName();if(!(draftName.trim()&&draftOk))return;
      S.name=draftName.trim();S.anchor=draftAnchor;S.plan=PLANS[draftPlan]?draftPlan:'base';S.planD=t;S.pet=draftPet;S.fur=furOf(draftPet,draftFur).k;S.petName=(draftPetName.trim()||PETN[draftPet]).slice(0,8);
      S.bday=draftBM&&draftBD?String(draftBM).padStart(2,'0')+'-'+String(draftBD).padStart(2,'0'):'';S.onboarded=true;S.consent=t;S.start=t;
      /* her own invitation code, and the friend whose link brought her here */
      S.nut=draftNut;S.rc=S.rc||newCode();{const r=REFX||S.refQ||'';if(r&&r!==S.rc)S.ref=r}delete S.refQ;
      tab='today';save();render();scrollTo(0,0);if(CLOUD)cloudSave(true);break;
  }
});
document.addEventListener('change',e=>{if(e.target.id==='bm')draftBM=e.target.value;if(e.target.id==='bd')draftBD=e.target.value});
document.addEventListener('input',e=>{if(e.target.id==='pn')draftPetName=e.target.value;if(e.target.id==='kg'){draft.kg=e.target.value;const er=$('#kgerr');if(er)er.hidden=true}if(e.target.id==='q'){const a=$('#askbtn');if(a)a.href=waLink(askText(e.target.value.trim()))}if(e.target.id==='nm'){draftName=e.target.value;const s=document.querySelector('[data-act=start]');if(s)s.disabled=!(draftName.trim()&&draftOk)}});
document.addEventListener('change',e=>{if(e.target.id==='ok'){keepName();draftOk=e.target.checked;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm'&&!S.onboarded){e.preventDefault();const b=$('[data-act=obnext]');if(b)b.click()}});

S=load()||(DEMO?seed():fresh());
if(!S.pet){S.pet='cat';S.petName='招财';S.bday=S.bday||''}
if(!S.fur)S.fur=furOf(S.pet,'').k;
if(!S.seen)S.seen=[];
if(!PLANS[S.plan])S.plan='base';
if(!S.tasks||typeof S.tasks!=='object')S.tasks={};
if(PI.phone)S.pphone=PI.phone;
if(PI.name)S.partner=PI.name;
if(S.onboarded&&!S.rc)S.rc=newCode();
/* a friend's invitation survives the address being tidied before she finishes signing up */
if(!S.onboarded){if(REFX)S.refQ=REFX;else if(S.refQ){REFX=S.refQ;draftNut=false}}
save();loadNews();render();fetchNews();cloudInit();
if(!DEMO&&tab==='today'&&S.onboarded&&S.checks[today()])setTimeout(maybeNews,1500);
/* the partner's month-summary link opens that summary straight away */
{const mq=+(new URLSearchParams(location.search).get('m')||0);if(mq&&S.onboarded)setTimeout(()=>showMonth(mq),600)}
</script>
