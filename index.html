<body>
<title>营养好习惯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap">
<style>
/* 「日签」: the page reads like the morning card she shares — a big serif date, one plant, quiet sage paper,
   one accent colour. The day-card at the top takes today's morning-card tint; everything else stays calm. */
:root{
  --paper:#F2F4EF; --surface:#FFFFFF; --ink:#1F2B24; --muted:#5F6B63; --line:#DDE3DA;
  --accent:#2F5D46; --accent-deep:#234836; --accent-soft:#E4ECE5; --on-accent:#FFFFFF;
  --gold:#86682A; --gold-bright:#C9A659; --gold-soft:#F4EEDD;
  --shadow:rgba(31,43,36,.08);
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-serif:"Noto Serif SC","Songti SC","STSong",serif;
  --f-num:"DM Serif Display","Noto Serif SC",serif;
  /* older names kept so every part of the page follows the same palette */
  --bg:var(--paper); --coral:var(--accent); --coral-deep:var(--accent-deep); --coral-soft:var(--accent-soft); --coral-text:var(--accent); --on-coral:var(--on-accent);
  --leaf:var(--accent); --leaf-dark:var(--accent); --leaf-soft:var(--accent-soft); --on-leaf:var(--on-accent);
  --f-fun:var(--f-serif);
  --pot:#C4876A; --soil:#6A4B39; --petal:#E07A8F; --petal2:#F2A98C; --water:#5E9CCB;
  --sky1:#E9EEE6; --sky2:#F6F8F4;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121714; --surface:#1A211D; --ink:#E9EFEA; --muted:#A3AFA7; --line:#2C3630;
  --accent:#8CC2A3; --accent-deep:#5E9478; --accent-soft:#213129; --on-accent:#0E1A13;
  --gold:#D9B76E; --gold-bright:#C9A04E; --gold-soft:#2E2918;
  --shadow:rgba(0,0,0,.4); --soil:#4B3427; --sky1:#1C241F; --sky2:#161C18; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121714; --surface:#1A211D; --ink:#E9EFEA; --muted:#A3AFA7; --line:#2C3630;
  --accent:#8CC2A3; --accent-deep:#5E9478; --accent-soft:#213129; --on-accent:#0E1A13;
  --gold:#D9B76E; --gold-bright:#C9A04E; --gold-soft:#2E2918;
  --shadow:rgba(0,0,0,.4); --soil:#4B3427; --sky1:#1C241F; --sky2:#161C18; color-scheme:dark}

html{font-size:20px} html.fs-s{font-size:18px} html.fs-m{font-size:20px} html.fs-l{font-size:23px}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.7;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{font-family:var(--f-serif);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold-bright);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px calc(6rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:.8rem;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.ok{background:var(--accent);color:var(--on-accent)}
.gold{color:var(--gold);font-weight:700}

/* the day-card: today's date, greeting and the plant, tinted like today's morning card */
.hero{--t-bg:#E4EADF;--t-deep:#CEDBC6;--t-ink:#2E4233;position:relative;border-radius:30px;padding:20px 20px 18px;background:var(--t-bg);color:var(--t-ink);display:flex;flex-direction:column;gap:6px;overflow:hidden}
.h-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.h-date{display:flex;align-items:center;gap:10px}
.h-num{font-family:var(--f-num);font-size:3.4rem;line-height:.9;font-variant-numeric:lining-nums}
.h-md{font-family:var(--f-serif);font-weight:600;font-size:.9rem;line-height:1.35;opacity:.85}
.h-pts{flex:none;font-size:.85rem;padding-top:4px;opacity:.9;white-space:nowrap}
.h-pts b{font-family:var(--f-num);font-weight:400;font-size:1.25rem;margin-left:.3em;color:inherit}
.h-pts.bump b{display:inline-block;animation:bump .6s}
.h-greet{position:relative;z-index:1;font-size:1.5rem;line-height:1.35;margin-top:8px;text-wrap:balance}
.h-fest{font-size:.85rem;opacity:.8}
.h-cap{align-self:center;text-align:center;font-family:var(--f-serif);font-weight:600;font-size:.95rem;line-height:1.5;text-wrap:balance}
.h-cap.mute{font-family:var(--f-body);font-weight:400;opacity:.75}
.h-cap.new{animation:pop .6s ease-out 1.1s both}
.h-foot{display:flex;flex-direction:column;gap:6px;font-size:.85rem;margin-top:4px}
.h-foot b{font-family:var(--f-num);font-weight:400;font-size:1.15rem}
.h-foot .bar{background:rgba(255,255,255,.6)}
.h-foot .bar i{background:currentColor;opacity:.7}
.plant{position:relative;height:12.5rem;display:flex;justify-content:center;align-items:flex-end;margin-top:4px}
.plant::after{content:"";position:absolute;left:4%;right:4%;bottom:0;height:1px;background:currentColor;opacity:.16}
.plant svg{position:relative;height:100%;width:auto;max-width:100%;overflow:visible}
.plant .disc{position:absolute;left:50%;bottom:13%;height:70%;max-height:10rem;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:var(--t-deep);box-shadow:0 0 0 12px var(--t-bg),0 0 0 13px var(--t-deep)}
.plant svg.grow{transform-origin:50% 100%;animation:grow 1s cubic-bezier(.3,1.7,.5,1) .55s both}
.plant .drop{position:absolute;left:50%;top:0;width:26px;margin-left:-13px;animation:drop .75s ease-in forwards;z-index:3}
.plant .drop path{fill:var(--water)}
.sway{animation:sway 6s ease-in-out infinite}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .8s}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:var(--surface);background:color-mix(in oklab,var(--t-bg) 13%,var(--surface));color:var(--ink)}
  :root:not([data-theme="light"]) .plant .disc{background:color-mix(in oklab,var(--t-deep) 22%,var(--surface));box-shadow:0 0 0 12px color-mix(in oklab,var(--t-bg) 13%,var(--surface)),0 0 0 13px color-mix(in oklab,var(--t-deep) 26%,var(--surface))}
  :root:not([data-theme="light"]) .h-foot .bar{background:rgba(255,255,255,.12)}}
:root[data-theme="dark"] .hero{background:var(--surface);background:color-mix(in oklab,var(--t-bg) 13%,var(--surface));color:var(--ink)}
:root[data-theme="dark"] .plant .disc{background:color-mix(in oklab,var(--t-deep) 22%,var(--surface));box-shadow:0 0 0 12px color-mix(in oklab,var(--t-bg) 13%,var(--surface)),0 0 0 13px color-mix(in oklab,var(--t-deep) 26%,var(--surface))}
:root[data-theme="dark"] .h-foot .bar{background:rgba(255,255,255,.12)}

/* plant parts */
.p-pot{fill:var(--pot)} .p-rim{fill:var(--pot);filter:brightness(1.08)} .p-soil{fill:var(--soil)} .p-band{stroke:var(--surface);stroke-width:4;opacity:.25;fill:none}
.p-stem{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.p-leaf{fill:var(--accent)} .p-vein{fill:none;stroke:var(--accent);stroke-width:1.4;opacity:.55}
.p-pet{fill:var(--petal)} .p-pet2{fill:var(--petal2)} .p-ctr{fill:var(--gold-bright)} .p-seed{fill:var(--soil)} .p-spark{fill:var(--gold-bright)}

/* the one action */
.checkin{position:relative;width:100%;min-height:4.2rem;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:1.25rem;font-weight:700;line-height:1.3;box-shadow:0 8px 20px rgba(35,72,54,.22);display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 22px;text-align:left;transition:transform .12s}
.checkin:active{transform:scale(.98)}
.checkin .ic{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.checkin .ic svg{width:1rem}
.checkin .sub{display:block;font-size:.8rem;font-weight:400;opacity:.85}
.checkin[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.link-btn{align-self:center;background:none;border:0;padding:6px 0;min-height:44px;color:var(--muted);font-size:.9rem;text-decoration:underline;text-underline-offset:4px;text-align:center}

/* after the check-in: a quiet confirmation with the partner's words */
.donec{gap:14px}
.d-head{display:flex;align-items:center;gap:14px}
.d-check{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.d-check svg{width:1.3rem;height:1.3rem}
.d-check.new{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.done-t{font-size:1.2rem;line-height:1.35}
.d-pts{flex:none;align-self:flex-start;font-family:var(--f-num);font-size:1.35rem;line-height:1.2;color:var(--gold);text-align:center}
.d-pts small{display:block;font-family:var(--f-body);font-size:.7rem;line-height:1.2}
.donec .link-btn{margin:-6px 0 -8px}
.float{position:absolute;left:50%;top:-6px;font-weight:700;font-size:1.3rem;color:var(--gold);animation:floatUp 1.4s ease-out forwards;pointer-events:none;white-space:nowrap}
</style>
<style>
/* plant palette: sage leaves, a matte clay pot, dusty-pink flowers; flowers and pots keep their colour in dark mode */
:root{--leaf-a:#4C7A5B;--leaf-b:#8DB596;--stem:#5B8666;--pk0:#B9466A;--pk1:#D9677F;--pk2:#EE9EAF;--pk3:#FBE6EA;--cr0:#C0603F;--cr1:#DE8762;--cr2:#F1B394;--cr3:#FCEADF;--bl1:#5E8FC4;--bl2:#9BC0E3;--bl3:#E2EEF8;
  --pot-a:#D9A387;--pot-b:#C4876A;--pot-c:#A86C52;--glz-a:#D3E2D8;--glz-b:#A9C6B5;--glz-c:#83A693;--stamen:#A47718;--plant-shadow:rgba(31,43,36,.13);--hi:rgba(255,255,255,.16);--pot-bloom:rgba(255,255,255,.85)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--leaf-a:#5E9A72;--leaf-b:#9FCCA9;--stem:#6FA37E;--plant-shadow:rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--leaf-a:#5E9A72;--leaf-b:#9FCCA9;--stem:#6FA37E;--plant-shadow:rgba(0,0,0,.45)}
.p-stemf{fill:var(--stem)} .p-petiole{fill:none;stroke:var(--stem);stroke-width:1.6;stroke-linecap:round}
.p-vein{fill:none;stroke:var(--leaf-a);stroke-width:.9;opacity:.5}
.p-sepal{fill:var(--leaf-a)} .p-stamen{fill:var(--stamen)} .p-shadow{fill:var(--plant-shadow)}
.p-hi{fill:none;stroke:var(--hi);stroke-width:3.5;stroke-linecap:round} .p-pblm{fill:var(--pot-bloom)} .p-shine{fill:var(--hi)}
.p-goldline{stroke:var(--gold-bright);stroke-width:2} .p-body{fill:var(--ink)} .p-ground{fill:var(--accent-soft)} .p-fall{fill:var(--pk2)}
.hl{opacity:.55;animation:hlp 1.6s ease-in-out infinite alternate}
@keyframes hlp{from{opacity:.2}to{opacity:.75}}

/* cards: one quiet style; hierarchy comes from type, not colour */
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:1.1rem;line-height:1.4}
.eyebrow{font-size:.85rem;color:var(--muted)}
.btn{min-height:3rem;border-radius:999px;padding:8px 20px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.solid{background:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* morning picture */
.frame{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/5;width:100%;max-width:100%;background:var(--accent-soft)}
.frame img{display:block;width:100%;height:100%;object-fit:cover;-webkit-touch-callout:default;user-select:auto}
.frame img.reveal{animation:reveal .9s ease-out}
.blurimg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(18px) saturate(.9)}
.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
.lock .ring{width:3.4rem;height:3.4rem;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center}
.lock .ring svg{width:1.4rem;height:1.4rem}
.lock .pill{background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px;font-size:.9rem;font-weight:500}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.frame.teaser{aspect-ratio:16/9}

/* the partner's question sits inside the partner card */
.care{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.care .eyebrow{color:var(--muted)}
.care h3{font-size:1.08rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:3.2rem;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;padding:10px 16px;font-weight:500}
.opt:active,.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.reply{display:flex;gap:10px;align-items:flex-start}
.avatar{flex:none;width:2.2rem;height:2.2rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.bubble{background:var(--paper);border-radius:4px 16px 16px 16px;padding:10px 14px;min-width:0}
.bubble b{display:block;font-size:.8rem;color:var(--muted)}

/* surprise card */
.prize{border-radius:24px;background:var(--surface);border:1px solid var(--line);padding:18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .45s ease-out}
.prize .p-big{font-family:var(--f-serif);font-weight:600;font-size:1.3rem;color:var(--ink);line-height:1.35}

/* records page */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .wd{font-size:.8rem;color:var(--muted)}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-size:.95rem}
.cal .d.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--gold-bright)}
.cal .d.pre{color:var(--line)}
.path{display:flex;flex-direction:column}
.stone{display:grid;grid-template-columns:3rem 1fr;gap:12px;align-items:center;position:relative;padding-bottom:14px}
.stone:not(:last-child)::before{content:"";position:absolute;left:1.45rem;top:3rem;bottom:0;width:2px;background:var(--line)}
.stone.got:not(:last-child)::before{background:var(--accent)}
.mini{width:3rem;height:3rem;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;overflow:hidden}
.mini svg{height:2.5rem;width:auto}
.stone.got .mini{border-color:var(--accent);background:var(--accent-soft)}
.stone.next .mini{border-color:var(--gold-bright)}
.mini.secret{font-family:var(--f-serif);font-size:1.2rem;color:var(--muted);border-style:dashed}
.stone h4{font-size:1.02rem}
.fsopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fsopt{min-height:5rem;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;font-weight:700}
.fsopt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.qa{display:flex;flex-direction:column;gap:10px}
.qa div{border-bottom:1px solid var(--line);padding-bottom:8px}
.qa div:last-child{border:0}

/* feelings */
.metric{display:flex;flex-direction:column;gap:6px}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.face{min-height:3.2rem;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;padding:4px}
.face svg,.fc{width:1.8rem;height:1.8rem;display:block}
.face[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;min-height:3rem}
textarea{min-height:5.5rem;resize:vertical}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem}
.legend span::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
.chart{width:100%;height:auto;display:block}
.note{font-size:.85rem;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}

/* page header on the records and feelings pages */
.phead{padding:10px 4px 2px}
.phead h1{font-size:1.6rem;line-height:1.3}
.phead p{color:var(--muted);font-size:.9rem;margin-top:2px}

/* nav, overlay, misc */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;max-width:520px}
nav.tabs button{border:0;background:none;min-height:3.5rem;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:.85rem;font-weight:500}
nav.tabs button svg{width:1.4rem;height:1.4rem}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:700}
#overlay{position:fixed;inset:0;background:rgba(18,26,21,.55);display:grid;place-items:center;padding:16px;z-index:10}
#overlay .box{background:var(--surface);border-radius:28px;padding:24px 22px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .45s ease-out}
#overlay .box svg{height:9rem;width:auto}
#overlay .medal{font-family:var(--f-serif);font-weight:700;font-size:1.9rem;color:var(--ink);line-height:1.25}
#overlay .checkin{min-height:3.4rem;font-size:1.05rem;background:transparent;color:var(--accent);border:1.5px solid var(--accent);box-shadow:none;margin-top:2px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
details.demo{border:1px dashed var(--line);border-radius:16px;padding:8px 14px;color:var(--muted);font-size:.85rem}
details.demo summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
footer.fine{font-size:.78rem;color:var(--muted);text-align:center;line-height:1.6;padding-top:4px}

@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes grow{0%{transform:scale(.92)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes drop{0%{transform:translateY(-30px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(7rem) scale(.6);opacity:0}}
@keyframes bump{40%{transform:scale(1.25)}}
@keyframes floatUp{0%{transform:translate(-50%,0);opacity:0}15%{opacity:1}100%{transform:translate(-50%,-80px);opacity:0}}

    else if(d===18){P.branches=true;P.bl=4;T=['b0','b1','b2','b3'];L='长出两根新枝，多了 4 片叶子'}
    else if(d<=24){P.bl++;T=['b'+(P.bl-1)];L=`长出第 ${P.main+P.bl} 片叶子`}
    else if(d===25){P.pot=1;[0,1,2].forEach(s=>P.buds.push({s,st:0}));T=['k0','k1','k2','pot'];L='结出第一批花苞，还换上了新花盆'}
    else if(d<=54){
      if((d-26)%2===0){const s=P.buds.length;P.buds.push({s,st:0});T=['k'+s];L=`又多了一个花苞，现在有 ${P.buds.length} 个`}

    else L='今天的花园，也开得很美';
    if(d===n){P.today=T;P.label=L}
  }
  return P;
}

let MCACHE={key:'',url:''},mBusy=null;
const MONTHS=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
function wrapLines(x,text,maxW){
  const out=[];let cur='';
  for(const ch of text){const t=cur+ch;
    if(x.measureText(t).width>maxW&&cur){if('，。！？、'.includes(ch)){out.push(t);cur='';continue}out.push(cur);cur=ch}else cur=t}
  if(cur)out.push(cur);return out;
}
function cLeaf(x,cx,cy,len,ang,col){
  x.save();x.translate(cx,cy);x.rotate(ang);x.beginPath();x.moveTo(0,0);
  x.quadraticCurveTo(len*.5,-len*.34,len,0);x.quadraticCurveTo(len*.5,len*.34,0,0);x.fillStyle=col;x.fill();x.restore();
}
function cBloom(x,cx,cy,r,th){
  for(let i=0;i<5;i++){const a=i*Math.PI*.4-Math.PI/2;x.beginPath();x.arc(cx+Math.cos(a)*r*.62,cy+Math.sin(a)*r*.62,r*.5,0,Math.PI*2);
    x.fillStyle=th.pet;x.fill();x.globalAlpha=.35;x.strokeStyle=th.acc;x.lineWidth=2;x.stroke();x.globalAlpha=1}
  x.beginPath();x.arc(cx,cy,r*.26,0,Math.PI*2);x.fillStyle=th.acc;x.fill();
}
function sprig(x,X,Y,len,lean,th,n){
  const tx=X+lean,ty=Y-len,cx=X-lean*.4+30,cy=Y-len*.55;
  x.strokeStyle=th.acc;x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(X,Y);x.quadraticCurveTo(cx,cy,tx,ty);x.stroke();
  for(let i=0;i<n;i++){const t=.2+i*(.72/n),px=(1-t)*(1-t)*X+2*t*(1-t)*cx+t*t*tx,py=(1-t)*(1-t)*Y+2*t*(1-t)*cy+t*t*ty;
    x.globalAlpha=i%2?.92:.7;cLeaf(x,px,py,118-i*10,-Math.PI/2+(i%2?.9:-.9),th.acc)}
  x.globalAlpha=1;
  [[0,-4,17],[-24,20,11],[22,26,9]].forEach(([dx,dy,r])=>cBloom(x,tx+dx,ty+dy,r,th));
}
function morningURL(){
  const g=imgWord(),key=today()+g+planOf(S);
  if(MCACHE.key===key)return Promise.resolve(MCACHE.url);
  if(mBusy&&mBusy.key===key)return mBusy.p;
  const p=(async()=>{
    const W=900,H=1125,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    const th=THEMES[hash(today())%THEMES.length],tip=tipToday(),bl=BLESS[hash(today()+'b')%BLESS.length];
    const d=pd(today()),num=String(d.getDate()),wk='星期'+'日一二三四五六'[d.getDay()],mo=MONTHS[d.getMonth()];
    try{await Promise.race([Promise.all([document.fonts.load('300px "DM Serif Display"',num),document.fonts.load('600 56px "Noto Serif SC"',g+tip+bl+wk+mo)]),new Promise(r=>setTimeout(r,3500))])}catch(e){}
    x.fillStyle=th.bg;x.fillRect(0,0,W,H);
    x.fillStyle=th.deep;x.beginPath();x.arc(650,300,240,0,Math.PI*2);x.fill();
    x.strokeStyle=th.deep;x.lineWidth=3;x.beginPath();x.arc(650,300,298,0,Math.PI*2);x.stroke();
    sprig(x,760,H+20,440,-80,th,7);sprig(x,870,H+20,300,-30,th,5);
    x.textAlign='left';x.textBaseline='alphabetic';x.fillStyle=th.ink;
    x.font='600 56px "Noto Serif SC","Songti SC",serif';x.fillText(g,92,160);
    x.font='300px "DM Serif Display","Noto Serif SC",serif';x.fillText(num,78,450);
    const nw=x.measureText(num).width;
    x.font='600 50px "Noto Serif SC","Songti SC",serif';x.fillText(mo,78+nw+34,335);
    x.font='500 40px "Noto Serif SC","Songti SC",serif';x.globalAlpha=.72;x.fillText(wk,78+nw+34,400);x.globalAlpha=1;
    x.fillStyle=th.acc;x.fillRect(92,525,72,6);
    x.fillStyle=th.ink;x.font='500 48px "Noto Serif SC","Songti SC",serif';
    wrapLines(x,tip,520).forEach((l,i)=>x.fillText(l,92,625+i*84));
    x.font='500 36px "Noto Serif SC","Songti SC",serif';x.globalAlpha=.7;x.fillText(bl,92,H-96);x.globalAlpha=1;
    const url=c.toDataURL('image/jpeg',.9);MCACHE={key,url};return url;
  })();
  mBusy={key,p};return p;
}

/* ---------- pet behaviour: stays beside the pot; sits, looks around, waves, grooms, lies down, stretches, takes a few slow steps ---------- */
let PET={x:null,face:1,t:0,bx:null,woke:false};
function petPose(pose,cls){const el=$('#petw'),pin=$('#petin');if(!el||!pin)return;pin.innerHTML=petSVG(S.pet,+el.dataset.stage,el.dataset.cos||'',pose,S.fur);pin.className='pet-in'+(PET.face<0?' mirror':'')+(cls?' '+cls:'')}
function petMove(el,x,dur,ease){el.style.transition=dur?`transform ${dur.toFixed(2)}s ${ease||'linear'}`:'none';el.style.transform=`translateX(${Math.round(x)}px)`}
function petStart(){
  clearTimeout(PET.t);const el=$('#petw');if(!el)return;
  const W=el.parentElement.clientWidth,w=el.offsetWidth,sv=el.parentElement.querySelector('svg'),pot=sv?sv.getBoundingClientRect().width*.22:40,minX=-w*.06,maxX=Math.max(minX,W-w*.94),home=Math.max(minX,Math.min(maxX,W/2-pot-w*.8));
  const awake=el.dataset.mode==='awake',gentle=calm();
  if(PET.x==null||!awake)PET.x=home;
  PET.x=Math.max(minX,Math.min(maxX,PET.x));petMove(el,PET.x,0);el.style.opacity=1;
  if(awake&&PET.face<0)$('#petin').classList.add('mirror');
  const ball=$('#ball');
  if(ball){if(PET.bx==null)PET.bx=Math.min(W-28,W/2+44);ball.style.transition='none';ball.style.transform=`translateX(${Math.round(PET.bx)}px)`}
  if(!awake)return;
  const rest=(p,ms)=>{petPose(p,'');PET.t=setTimeout(step,ms)};
  const go=(tx,run,after)=>{tx=Math.max(minX,Math.min(maxX,tx));const d=Math.abs(tx-PET.x);if(d<20){after();return}
    if(gentle)run=false;PET.face=tx>PET.x?1:-1;petPose(run?'run':'walk','');
    const dur=d/(run?85+Math.random()*20:26+Math.random()*10);
    petMove(el,tx,dur,run?'cubic-bezier(.3,.6,.35,1)':'cubic-bezier(.4,.1,.6,.9)');PET.x=tx;PET.t=setTimeout(after,dur*1000+80)};
  function step(){
    if(!document.body.contains(el))return;
    const r=Math.random(),st=+el.dataset.stage;
    if(ball&&!gentle&&r<.2)go(PET.bx-w*.55,true,()=>{const nb=8+Math.random()*(W-40);PET.bx=nb;ball.style.transition='transform 1.4s cubic-bezier(.2,.7,.3,1)';ball.style.transform=`translateX(${Math.round(nb)}px)`;rest('sit',1000)});
    else if(r<.4)go(Math.max(minX,home-w*.7)+Math.random()*w*.85,false,()=>rest(Math.random()<.5?'sit':'look',2200+Math.random()*2200));
    else if(r<.62)rest(st>=4&&Math.random()<.4?'wave':'sit',3200+Math.random()*2800);
    else if(r<.79)rest('look',1800+Math.random()*1400);
    else if(r<.89)rest('lie',3200+Math.random()*3000);
    else if(r<.96)rest('groom',2200+Math.random()*1400);
    else rest('stretch',1700);
  }
  if(PET.woke){PET.woke=false;PET.t=setTimeout(()=>rest('stretch',1800),1200)}else rest('sit',1200);
}

/* the Google Sheet arrives as CSV; quoted cells may hold commas and line breaks */
function csvRows(t){const R=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);R.push(row);row=[];f=''}
    else f+=c}
  if(f||row.length){row.push(f);R.push(row)}return R}
/* a Google Drive share link becomes an image address the page can show */
const imgURL=u=>{u=(u||'').trim();const m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{10,})/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1000':/^https:\/\//.test(u)?u:''};
const newsDate=d=>{d=(d||'').trim().replace(/\./g,'/');let m=d.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=d.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):''};
function parseNews(text){const R=csvRows(text).filter(r=>r.some(c=>c.trim()));if(R.length<2)return [];
  const H=R[0].map(h=>h.trim()),col=n=>H.findIndex(h=>h.includes(n)),ci={date:col('日期'),who:col('给谁'),type:col('类型'),title:col('标题'),body:col('内容'),img:col('图片'),btn:col('按钮文字'),link:col('按钮链接')};
  return R.slice(1).map(r=>{const g=k=>ci[k]>=0?(r[ci[k]]||'').trim():'',d=newsDate(g('date')),title=g('title');if(!d||!title)return null;
    return {id:'n'+hash(d+title),date:d,who:g('who')||'全部',type:g('type')||'资讯',title,body:g('body'),img:imgURL(g('img')),btn:g('btn'),link:g('link')}}).filter(Boolean)}

/* weekly feelings: one line per measure (skin joins for the skin plan); a table view sits underneath */
const FSER=[['e','精神','var(--c1)'],['s','睡眠','var(--c2)'],['g','肠胃','var(--c3)'],['sk','皮肤','var(--c4)']];
/* five simple line faces, from not good to very good */
const FACE_D=['M8.2 16.7c1.1-1.5 2.4-2.2 3.8-2.2s2.7.7 3.8 2.2','M8.7 16.1c.9-.9 2-1.3 3.3-1.3s2.4.4 3.3 1.3','M8.9 15.4h6.2','M8.7 14.3c.9 1 2 1.5 3.3 1.5s2.4-.5 3.3-1.5','M8.1 13.7c1.1 1.9 2.4 2.8 3.9 2.8s2.8-.9 3.9-2.8'];
const faceIn=v=>`<circle cx="12" cy="12" r="9.2"/><circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"/><path d="${FACE_D[v-1]}"/>`;
const faceSVG=v=>`<svg class="fc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">${faceIn(v)}</svg>`;
function chart(){
  const F=S.feel;if(!F.length)return '<p class="note">记录第一次以后，这里会画出你的变化。</p>';
  const W=320,H=170,L=30,R=14,T=12,B=30,xs=i=>F.length===1?(L+W-R)/2:L+i*(W-L-R)/(F.length-1),ys=v=>T+(5-v)*(H-T-B)/4;
  const ser=FSER.filter(([k])=>F.some(f=>f[k]));let g='';
  for(let v=1;v<=5;v++)g+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" style="stroke:var(--line)"/><svg x="2" y="${ys(v)-9}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" style="stroke:var(--muted);color:var(--muted)">${faceIn(v)}</svg>`;
  const lines=ser.map(([k,,c],j)=>{const dy=(j-(ser.length-1)/2)*3.6,P=F.map((f,i)=>f[k]?[xs(i),ys(f[k])+dy,i]:null).filter(Boolean);
    return `<polyline style="fill:none;stroke:${c};stroke-width:3;stroke-linejoin:round;stroke-linecap:round" points="${P.map(p=>p[0]+','+p[1]).join(' ')}"/>`+
      P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]===F.length-1?5.5:4.5}" style="fill:${c};stroke:var(--surface);stroke-width:2"/>`).join('')}).join('');
  const lab=F.map((f,i)=>`<text x="${xs(i)}" y="${H-8}" font-size="12" text-anchor="${F.length>1&&i===F.length-1?'end':F.length>1&&i===0?'start':'middle'}" style="fill:var(--muted)">第${f.day}天</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="感觉变化图">${g}${lines}${lab}</svg>
    <div class="legend">${ser.map(([,l,c])=>`<span style="--c:${c}">${l}</span>`).join('')}</div>
    ${F.length<2?'<p class="note">每个星期记录一次，就能看到自己的变化。</p>':''}
    <details class="rows"><summary>看全部记录</summary><table class="rtab"><tr><th>日期</th>${ser.map(([,l])=>`<th>${l}</th>`).join('')}</tr>
      ${F.slice().reverse().map(f=>`<tr><td>${esc(f.d.slice(5).replace('-','/'))}</td>${ser.map(([k])=>`<td>${f[k]?faceSVG(f[k])+f[k]:'–'}</td>`).join('')}</tr>`).join('')}</table></details>`;
}
/* weekly weight, only if she chose to fill it in */
function kgCard(){

    <div class="card"><h3>3. 你想先照顾哪一方面？</h3><p class="small muted" style="margin-top:-6px">每天会有 3 个小任务。以后可以在「记录」页换。</p>${planPick(draftPlan)}</div>
    <div class="card"><h3>4. 你打算什么时候吃营养？</h3><div class="opts">${['早餐后','午餐后','晚餐后'].map(a=>`<button class="opt${draftAnchor===a?' sel':''}" data-anchor="${a}">${a}</button>`).join('')}</div></div>
    <div class="card"><h3>5. 你想养小猫还是小狗？</h3><div class="petpick">${['cat','dog'].map(k=>`<button class="pp" data-pet="${k}" aria-pressed="${draftPet===k}">${petSVG(k,1,'','sit',k===draftPet?draftFur:'')}<span>${k==='cat'?'小猫':'小狗'}</span></button>`).join('')}</div>
      <p class="small muted" style="margin-top:12px">选一个毛色</p>${furPick(draftPet,furOf(draftPet,draftFur).k)}
      <label for="pn" class="small muted">它的名字（可以改）</label><input type="text" id="pn" maxlength="8" value="${esc(draftPetName)}"></div>
    <div class="card"><h3>6. 你的生日（可以不填）</h3><p class="small muted">生日那天，宠物会戴上生日帽陪你庆祝。</p>
      <div class="row"><select id="bm" aria-label="生日月份"><option value="">月</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}"${+draftBM===i+1?' selected':''}>${i+1} 月</option>`).join('')}</select>
      <select id="bd" aria-label="生日日期"><option value="">日</option>${Array.from({length:31},(_,i)=>`<option value="${i+1}"${+draftBD===i+1?' selected':''}>${i+1} 日</option>`).join('')}</select></div></div>
    <div class="card"><label style="display:flex;gap:12px;align-items:flex-start"><input type="checkbox" id="ok" ${draftOk?'checked':''} style="width:1.6rem;height:1.6rem;flex:none;margin-top:4px">
      <span>我同意把我的打卡、感觉记录、体重（如果有填）和问题安全地存在网上，只给我的伙伴 ${esc(S.partner)} 和团队领导用来关心我的情况。我可以随时在「记录」页删除这些资料。</span></label></div>
    <button class="checkin" data-act="start" ${ok?'':'disabled'}><span>种下我的健康花<span class="sub">开始 90 天旅程</span></span></button>`+demoTools();
}
function demoTools(){
  if(!DEMO)return '';
  return `<details class="demo"><summary>演示工具（给伙伴看，正式版没有）</summary>
    <div class="row" style="padding-bottom:8px"><button class="btn" data-act="next">跳到明天</button><button class="btn" data-act="prev">回到前一天</button>
    <button class="btn" data-act="jump">直接到下一个礼物日</button><button class="btn" data-act="fast">连续打卡 7 天</button>
    <button class="btn" data-act="new">看新客人第一天</button><button class="btn" data-act="sample">恢复示例</button></div>
    ${S.onboarded?`<div class="row" style="padding-bottom:8px">${Object.keys(PLANS).map(k=>`<button class="btn" data-plan="${k}" aria-pressed="${planOf(S)===k}">看${PLANS[k].name}</button>`).join('')}</div>`:''}
    <div class="row" style="padding-bottom:8px"><button class="btn" data-act="newsdemo">看本周信息弹窗</button><button class="btn" data-act="cos">看节日装扮${demoCos>=0?`（${demoCos+1}/${DEMO_COS.length}）`:''}</button>${demoCos>=0?'<button class="btn" data-act="cosoff">看平常样子</button>':''}</div>
    <div class="row" style="padding-bottom:8px">${[['am','看早上'],['day','看中午'],['dusk','看傍晚'],['night','看晚上'],['','跟随时间']].map(([k,l])=>`<button class="btn" data-period="${k}" aria-pressed="${demoP===k}">${l}</button>`).join('')}</div>
    <p>${S.sample?'现在显示的是示例客人「陈姐」的资料。':''}想看花每天的变化：先点「跳到明天」，再点打卡。试用版的资料只存在这部手机里。</p></details>`;
}
function footer(){return `<footer class="fine">本工具只记录生活习惯，不提供医疗建议。<br>Independent Distributor 自制工具</footer>`}

/* ---------- render, effects, events ---------- */
const calm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function render(){
  clearTimeout(PET.t);
  document.documentElement.className='fs-'+S.fs;
  const app=$('#app');
  if(!S.onboarded){app.innerHTML=viewOnboard();$('#nav').hidden=true;return}
  $('#nav').hidden=false;
  app.innerHTML=tab==='today'?viewToday():tab==='log'?viewLog():viewFeel();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  if(tab==='today'){fillMorning();setTimeout(petStart,0)}
}
let lastW=innerWidth;addEventListener('resize',()=>{if(innerWidth===lastW)return;lastW=innerWidth;if(tab==='today')petStart()});
function bumpPts(){const p=$('#pts');if(p){p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump')}}
function toDone(){const el=$('#done');if(el)el.scrollIntoView({behavior:calm()?'auto':'smooth',block:'start'})}
/* a few soft petals drift down, only for gifts and milestones */
function confetti(){
  if(calm())return;
  const c=$('#fx'),x=c.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight;
  c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);c.hidden=false;
  const cs=getComputedStyle(document.documentElement),cols=['--pk2','--pk1','--cr2','--pk3','--leaf-b'].map(v=>cs.getPropertyValue(v).trim()||'#EE9EAF');
  const P=Array.from({length:28},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,vy:1.2+Math.random()*1.4,sw:Math.random()*6.28,r:5+Math.random()*5,c:cols[Math.random()*cols.length|0],a:Math.random()*6.28,va:(Math.random()-.5)*.06}));
  let f=0;(function step(){x.clearRect(0,0,W,H);
    P.forEach(p=>{p.y+=p.vy;p.sw+=.03;p.a+=p.va;x.save();x.translate(p.x+Math.sin(p.sw)*18,p.y);x.rotate(p.a);x.globalAlpha=.9;x.fillStyle=p.c;
      x.beginPath();x.ellipse(0,0,p.r,p.r*.55,0,0,Math.PI*2);x.fill();x.restore()});
    if(++f<230)requestAnimationFrame(step);else{x.clearRect(0,0,W,H);c.hidden=true}})();
}
function celebrate(m){
  const o=$('#overlay'),line=m.stage==='开花'?'你的花开了！':`你的花${m.stage}了！`;
  o.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-label="${m.name}"><div class="ov-pics">${plantSVG(m.n,{hl:true})}${S.hidePet?'':petSVG(S.pet,petStage(m.n),'','sit',S.fur)}</div>
    <div class="medal">${m.name}</div><p style="font-family:var(--f-serif);font-size:1.1rem;font-weight:600">${line}累计打卡 ${m.n} 天</p>${S.hidePet?'':`<p>${esc(S.petName)}${PET_MS[m.id]||''}</p>`}
    <p>你的奖励：<b>${m.gift}</b></p><a class="btn solid" style="align-self:stretch" href="${waLink(`${S.partner} 你好，我是${S.name}，我完成了「${m.name}」，累计打卡 ${m.n} 天！奖励是：${m.gift}`)}" target="_blank" rel="noopener">告诉 ${esc(S.partner)} 领取奖励</a>
    <button class="checkin" data-act="close"><span>好的</span></button></div>`;
  o.hidden=false;o.querySelector('button').focus();confetti();
}
function checkMile(){
  const n=count(),news=MILES.filter(x=>n>=x.n&&!S.gifts[x.id]);if(!news.length)return false;
  news.forEach(x=>S.gifts[x.id]=today());save();celebrate(news[news.length-1]);return true;
}
function keepName(){const el=$('#nm');if(el)draftName=el.value}
function afterWater(scroll){
  render();justChecked=false;bumpPts();
  setTimeout(()=>document.querySelectorAll('.drop').forEach(el=>el.remove()),1200);
  setTimeout(()=>{if(!checkMile()){if(scroll)toDone();setTimeout(maybeNews,1900)}},1700);
}

document.addEventListener('click',e=>{
  const ak=e.target.closest('a[data-act=ask]');
  if(ak){const q=$('#q'),v=q?q.value.trim():'';if(!v){e.preventDefault();if(q)q.focus();return}
    ak.href=waLink(askText(v));S.questions.unshift({day:dayNum(),text:v});save();setTimeout(render,400);return}
  const b=e.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.act,t=today();
  if(b.dataset.tab){tab=b.dataset.tab;render();scrollTo(0,0);return}
  if(b.dataset.fs){keepName();S.fs=b.dataset.fs;save();render();return}
  if('period' in b.dataset){demoP=b.dataset.period;render();return}
  if(b.dataset.fur){if(S.onboarded){S.fur=b.dataset.fur;save()}else{keepName();draftFur=b.dataset.fur}render();return}
  if(b.dataset.pet){keepName();draftPet=b.dataset.pet;draftFur='';if(['','招财','旺财'].includes(draftPetName.trim()))draftPetName=PETN[draftPet];render();return}
  if(b.dataset.care){const d=b.dataset.care;S.answers[d]={a:b.dataset.a,d:t};S.points+=5;save();
    if(b.dataset.a==='去记录我的感觉')tab='feel';render();bumpPts();return}
  if(b.dataset.m){draft[b.dataset.m]=+b.dataset.v;render();return}
  if('quiz' in b.dataset){const f=S.flips[t];if(f&&f.type==='quiz'&&f.ans==null){const L=quizList(f);f.ans=+b.dataset.quiz;const ok=f.ans===L[f.i%L.length].a;S.points+=ok?5:2;save();render();bumpPts()}return}
  if(b.dataset.plan){const k=b.dataset.plan;if(!PLANS[k])return;
    if(!S.onboarded){keepName();draftPlan=k;render();return}
    if(planOf(S)!==k){S.plan=k;S.planD=t;draft={e:0,s:0,g:0,sk:0,kg:''};save();toast('已换成「'+PLANS[k].name+'」计划')}
    render();return}
  if(b.dataset.task){const id=b.dataset.task,L=((S.tasks||(S.tasks={}))[t]||[]).slice(),i=L.indexOf(id);
    if(i>=0){L.splice(i,1);S.points=Math.max(0,S.points-2)}else{L.push(id);S.points+=2;justTask=id}
    if(L.length)S.tasks[t]=L;else delete S.tasks[t];
    const all=PLANS[planOf(S)].tasks.every(([k])=>L.includes(k));save();render();justTask='';bumpPts();return}
  if(b.dataset.anchor){keepName();draftAnchor=b.dataset.anchor;render();return}
  switch(a){
    case 'check':S.checks[t]=1;S.points+=10;justChecked=true;PET.woke=true;save();afterWater(true);break;
    case 'makeup':S.checks[add(t,-1)]=1;S.points+=5;justChecked=true;save();afterWater(false);break;
    case 'fast':{if(S.checks[t])S.offset=(S.offset||0)+1;
      for(let i=0;i<7;i++){S.checks[today()]=1;S.points+=10;if(i<6)S.offset=(S.offset||0)+1}
      justChecked=true;tab='today';save();scrollTo(0,0);afterWater(false);break}
    case 'jump':{const m=nextMile();if(!m)break;
      while(count()<m.n){if(S.checks[today()])S.offset=(S.offset||0)+1;S.checks[today()]=1;S.points+=10}
      justChecked=true;tab='today';save();scrollTo(0,0);afterWater(false);break}
    case 'flip':{const r=hash(t+S.name)%100,won=Object.keys(S.flips).some(d=>S.flips[d].type==='gift'&&diff(d,t)>=0&&diff(d,t)<30);
      /* stage 1 gifts and blessings; stage 2 fewer gifts, facts and quizzes; stage 3 no random gifts */
      const stg=stageOf(count()),G=[6,3,0][stg-1],P=[36,28,20][stg-1];let f;
      if(r<G&&!won)f={type:'gift'};else if(r<P){f={type:'pts'};S.points+=5}
      else if(stg===1)f={type:'bless',text:BLESS[hash(t)%BLESS.length]};
      /* facts and quizzes alternate between everyday ones and ones for her plan */
      else if(r<(P+100)/2){const pk=planOf(S),pt=PLAN_TXT[pk];
        if(pt&&((S.factN||0)+(S.pfactN||0))%2){f={type:'fact',p:pk,i:(S.pfactN||0)%pt.facts.length};S.pfactN=(S.pfactN||0)+1}
        else{f={type:'fact',i:(S.factN||0)%FACTS.length};S.factN=(S.factN||0)+1}}
      else{const pk=planOf(S),pt=PLAN_TXT[pk];
        if(pt&&((S.quizN||0)+(S.pquizN||0))%2){f={type:'quiz',p:pk,i:(S.pquizN||0)%pt.quiz.length,ans:null};S.pquizN=(S.pquizN||0)+1}
        else{f={type:'quiz',i:(S.quizN||0)%QUIZ.length,ans:null};S.quizN=(S.quizN||0)+1}}
      S.flips[t]=f;save();render();if(f.type==='gift'||f.type==='pts')bumpPts();if(f.type==='gift')confetti();break}
    case 'feel':{if(!feelReady())return;const pk=planOf(S),rec={d:t,day:dayNum(),e:draft.e,s:draft.s,g:draft.g};
      if(pk==='skin')rec.sk=draft.sk;
      if(pk==='weight'){const raw=String(draft.kg||'').trim().replace(/[,，。]/g,'.');
        if(raw){const v=parseFloat(raw);if(!/^\d{2,3}(\.\d{1,2})?$/.test(raw)||!(v>=25&&v<=250)){const er=$('#kgerr');if(er)er.hidden=false;const k=$('#kg');if(k)k.focus();return}rec.kg=Math.round(v*10)/10}}
      S.feel.push(rec);draft={e:0,s:0,g:0,sk:0,kg:''};S.points+=10;save();render();break}
    case 'ask':{const v=$('#q').value.trim();if(!v)return;S.questions.unshift({day:dayNum(),text:v});save();render();break}
    case 'a2hs':S.a2hs=true;save();render();break;
    case 'pettoggle':S.hidePet=!S.hidePet;save();render();toast(S.hidePet?'「今天」页不再显示宠物':'「今天」页会显示宠物');break;
    case 'rename':{const v=($('#pn2')||{}).value;if(v&&v.trim()){S.petName=v.trim().slice(0,8);save();render()}break}
    case 'cos':demoCos=demoCos+1>=DEMO_COS.length?-1:demoCos+1;render();break;
    case 'cosoff':demoCos=-1;render();break;
    case 'close':$('#overlay').hidden=true;toDone();break;
    case 'nclose':$('#overlay').hidden=true;break;
    case 'delme':cloudDelete();break;
    case 'news':{const id=b.dataset.nid,x=newsList().find(n=>n.id===id)||[newsNow().card].find(n=>n&&n.id===id);showNews(x);break}
    case 'newsdemo':showNews(newsNow().card||demoNews()[2]);break;
    case 'next':S.offset=(S.offset||0)+1;save();render();scrollTo(0,0);break;
    case 'prev':if(diff(S.start,add(t,-1))>=0){S.offset=(S.offset||0)-1;save();render()}break;
    case 'new':{const fs=S.fs;S=fresh();S.fs=fs;draftName='';draftAnchor='';draftOk=false;draftPet='cat';draftFur='';draftPetName='招财';draftBM='';draftBD='';draftPlan=PLANQ||'base';tab='today';save();render();scrollTo(0,0);break}
    case 'sample':S=seed();tab='today';save();render();scrollTo(0,0);break;
    case 'start':keepName();if(!(draftName.trim()&&draftAnchor&&draftOk))return;
      S.name=draftName.trim();S.anchor=draftAnchor;S.plan=PLANS[draftPlan]?draftPlan:'base';S.planD=t;S.pet=draftPet;S.fur=furOf(draftPet,draftFur).k;S.petName=(draftPetName.trim()||PETN[draftPet]).slice(0,8);
      S.bday=draftBM&&draftBD?String(draftBM).padStart(2,'0')+'-'+String(draftBD).padStart(2,'0'):'';S.onboarded=true;S.consent=t;S.start=t;tab='today';save();render();scrollTo(0,0);if(CLOUD)cloudSave(true);break;
  }
});
document.addEventListener('change',e=>{if(e.target.id==='bm')draftBM=e.target.value;if(e.target.id==='bd')draftBD=e.target.value});
document.addEventListener('input',e=>{if(e.target.id==='pn')draftPetName=e.target.value;if(e.target.id==='kg'){draft.kg=e.target.value;const er=$('#kgerr');if(er)er.hidden=true}if(e.target.id==='q'){const a=$('#askbtn');if(a)a.href=waLink(askText(e.target.value.trim()))}if(e.target.id==='nm'){draftName=e.target.value;const s=document.querySelector('[data-act=start]');if(s)s.disabled=!(draftName.trim()&&draftAnchor&&draftOk)}});
document.addEventListener('change',e=>{if(e.target.id==='ok'){keepName();draftOk=e.target.checked;render()}});

S=load()||(DEMO?seed():fresh());
if(!S.pet){S.pet='cat';S.petName='招财';S.bday=S.bday||''}
if(!S.fur)S.fur=furOf(S.pet,'').k;
if(!S.seen)S.seen=[];
if(!PLANS[S.plan])S.plan='base';
if(!S.tasks||typeof S.tasks!=='object')S.tasks={};
if(PI.phone)S.pphone=PI.phone;
if(PI.name)S.partner=PI.name;
save();loadNews();render();fetchNews();cloudInit();
if(!DEMO&&tab==='today'&&S.onboarded&&S.checks[today()])setTimeout(maybeNews,1500);
</script>
</body></html>
