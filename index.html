<body>
<title>营养好习惯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@500;600&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: one phone column. A sunrise "health garden" with a growing plant leads; one big game-style button below it; rewards stack underneath (today's image, surprise card, partner question). 3-tab bottom bar. */
:root{
  --bg:#FFF4EE; --surface:#FFFFFF; --ink:#2B211D; --muted:#6F625C; --line:#F0DCD1;
  --coral:#E2492F; --coral-deep:#AE2F1A; --coral-soft:#FFE2D8; --coral-text:#B3311B; --on-coral:#FFFFFF;
  --leaf:#2F9A57; --leaf-dark:#1E6B3B; --leaf-soft:#DCF2E3; --on-leaf:#FFFFFF;
  --gold:#9A6100; --gold-bright:#F5B731; --gold-soft:#FFF0C6;
  --pot:#C9653C; --soil:#6B4430; --petal:#F06A86; --petal2:#FF9E78; --water:#3F9BDE;
  --sky1:#FFD3BE; --sky2:#FFF4CC; --sun:#FFD25E;
  --shadow:rgba(140,60,25,.13);
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-fun:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17110E; --surface:#231A16; --ink:#F7EDE8; --muted:#C3B1A9; --line:#3B2C26;
  --coral:#FF7C62; --coral-deep:#B9452F; --coral-soft:#42231C; --coral-text:#FF9F8A; --on-coral:#23100B;
  --leaf:#5CCF89; --leaf-dark:#4CC07C; --leaf-soft:#1C3527; --on-leaf:#0E2016;
  --gold:#F4C45C; --gold-bright:#F4B733; --gold-soft:#3C2F18;
  --pot:#B65A36; --soil:#4B3123; --petal:#FF8CA3; --petal2:#FFB08F; --water:#6BB8F0;
  --sky1:#3B2420; --sky2:#2F2C1C; --sun:#D9A43C;
  --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17110E; --surface:#231A16; --ink:#F7EDE8; --muted:#C3B1A9; --line:#3B2C26;
  --coral:#FF7C62; --coral-deep:#B9452F; --coral-soft:#42231C; --coral-text:#FF9F8A; --on-coral:#23100B;
  --leaf:#5CCF89; --leaf-dark:#4CC07C; --leaf-soft:#1C3527; --on-leaf:#0E2016;
  --gold:#F4C45C; --gold-bright:#F4B733; --gold-soft:#3C2F18;
  --pot:#B65A36; --soil:#4B3123; --petal:#FF8CA3; --petal2:#FFB08F; --water:#6BB8F0;
  --sky1:#3B2420; --sky2:#2F2C1C; --sun:#D9A43C;
  --shadow:rgba(0,0,0,.45); color-scheme:dark}

html{font-size:20px} html.fs-s{font-size:18px} html.fs-m{font-size:20px} html.fs-l{font-size:23px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.7;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold-bright);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px calc(6rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:.8rem;font-weight:700;padding:2px 12px;border-radius:999px;background:var(--coral-soft);color:var(--coral-text);white-space:nowrap}
.tag.ok{background:var(--leaf-soft);color:var(--leaf-dark)}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hello{font-family:var(--f-fun);font-size:1.9rem;line-height:1.25;text-wrap:balance}
.date{color:var(--muted);font-size:.9rem}
.pts{flex:none;display:flex;align-items:center;gap:6px;background:var(--gold-soft);color:var(--gold);font-weight:900;border-radius:999px;padding:6px 14px 6px 8px;font-variant-numeric:tabular-nums}
.pts svg{width:1.5rem;height:1.5rem}
.pts.bump{animation:bump .6s}

/* garden hero */
.garden{position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2));padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 22px var(--shadow)}
.garden .sun{position:absolute;right:-70px;top:-70px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,var(--sun) 0 30%,transparent 70%);opacity:.45}
.g-head{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stage{font-family:var(--f-fun);font-size:1.4rem;line-height:1.2;color:var(--leaf-dark)}
.days{font-weight:900;font-size:2.3rem;line-height:1;color:var(--coral);font-variant-numeric:tabular-nums;white-space:nowrap}
.days small{font-size:.85rem;font-weight:700;color:var(--muted);margin-left:4px}
.days small:first-child{margin:0 6px 0 0}
.plant{position:relative;height:12.5rem;display:flex;justify-content:center;align-items:flex-end}
.plant svg{height:100%;width:auto;max-width:100%;overflow:visible}
.plant svg.grow{transform-origin:50% 100%;animation:grow 1s cubic-bezier(.3,1.7,.5,1) .55s both}
.plant .drop{position:absolute;left:50%;top:0;width:30px;margin-left:-15px;animation:drop .75s ease-in forwards}
.plant .drop path{fill:var(--water)}
.sway{animation:sway 5s ease-in-out infinite}
.next{position:relative;display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:999px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--leaf),var(--gold-bright));transition:width .8s}
.week{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week span{display:block;font-size:.72rem;color:var(--muted);line-height:1.4}
.wk{width:100%;max-width:2rem;aspect-ratio:1;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px dashed var(--line);font-size:.85rem;font-weight:900}
.wk.on{background:var(--leaf);border:2px solid var(--leaf);color:var(--on-leaf)}
.wk.today{border-color:var(--coral);border-style:solid}

/* plant parts */
.p-pot{fill:var(--pot)} .p-rim{fill:var(--pot);filter:brightness(1.12)} .p-soil{fill:var(--soil)} .p-band{stroke:var(--surface);stroke-width:4;opacity:.35;fill:none}
.p-stem{fill:none;stroke:var(--leaf-dark);stroke-width:5;stroke-linecap:round}
.p-leaf{fill:var(--leaf)} .p-vein{fill:none;stroke:var(--leaf-dark);stroke-width:1.4;opacity:.55}
.p-pet{fill:var(--petal)} .p-pet2{fill:var(--petal2)} .p-ctr{fill:var(--gold-bright)} .p-seed{fill:var(--soil)} .p-spark{fill:var(--gold-bright)}

/* main button */
.checkin{position:relative;width:100%;min-height:6rem;border:0;border-radius:999px;background:var(--coral);color:var(--on-coral);font-size:1.45rem;font-weight:900;line-height:1.3;box-shadow:0 7px 0 var(--coral-deep),0 14px 26px var(--shadow);display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 20px;margin-bottom:6px;text-align:left}
.checkin::after{content:"";position:absolute;inset:-7px;border-radius:inherit;border:3px solid var(--coral);opacity:0;animation:ring 2.2s ease-out infinite;pointer-events:none}
.checkin:active{transform:translateY(6px);box-shadow:0 1px 0 var(--coral-deep),0 6px 14px var(--shadow)}
.checkin .ic{flex:none;width:2.8rem;height:2.8rem;border-radius:50%;background:var(--on-coral);color:var(--coral);display:grid;place-items:center}
.checkin .ic svg{width:1.3rem}
.checkin .sub{display:block;font-size:.8rem;font-weight:500;opacity:.92}
.checkin[disabled]{opacity:.45;cursor:not-allowed;animation:none}
.checkin[disabled]::after{display:none}
.done{position:relative;display:flex;flex-direction:column;gap:12px;background:var(--surface);border-radius:22px;padding:16px 18px;box-shadow:0 2px 12px var(--shadow)}
.done-top{display:flex;align-items:center;gap:14px}
.done-t{font-size:1.25rem;line-height:1.3}
.done .reply{border-top:1px solid var(--line);padding-top:12px;align-items:center}
.done .avatar{width:2.2rem;height:2.2rem;font-size:.9rem}
.gold{color:var(--gold);font-weight:700}
.stamp{flex:none;width:3.8rem;height:3.8rem;border-radius:50%;border:4px double var(--coral);color:var(--coral);display:grid;place-items:center;font-family:var(--f-fun);font-size:1rem;line-height:1.1;text-align:center;transform:rotate(-12deg)}
.stamp.new{animation:stamp .55s cubic-bezier(.2,1.6,.4,1)}
.float{position:absolute;left:50%;top:-6px;font-weight:900;font-size:1.5rem;color:var(--gold);text-shadow:0 2px 0 var(--surface);animation:floatUp 1.4s ease-out forwards;pointer-events:none;white-space:nowrap}
.link-btn{align-self:flex-start;background:none;border:0;padding:8px 0;min-height:44px;color:var(--coral-text);font-weight:700;text-decoration:underline;text-underline-offset:4px;text-align:left}
</style>
<style>
/* plant palette: flowers and pots are content colours, so only leaves, stem and shadow shift in dark mode */
:root{--leaf-a:#2F8A55;--leaf-b:#7DCB8F;--stem:#3E7D50;--pk0:#C23A60;--pk1:#E2557A;--pk2:#F59AB0;--pk3:#FFE4EB;--cr0:#C9472A;--cr1:#E8693F;--cr2:#FAAA88;--cr3:#FFE7DC;--bl1:#3F8FD8;--bl2:#86C2F2;--bl3:#DDF0FF;
  --pot-a:#E58C5E;--pot-b:#CC6A40;--pot-c:#A24D2B;--glz-a:#BFE3D5;--glz-b:#86C2AC;--glz-c:#5B9D87;--stamen:#B8800F;--plant-shadow:rgba(90,40,15,.16);--hi:rgba(255,255,255,.3);--pot-bloom:rgba(255,255,255,.88)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--leaf-a:#3FA56A;--leaf-b:#93DDA5;--stem:#5AA672;--plant-shadow:rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--leaf-a:#3FA56A;--leaf-b:#93DDA5;--stem:#5AA672;--plant-shadow:rgba(0,0,0,.45)}
.p-stemf{fill:var(--stem)} .p-petiole{fill:none;stroke:var(--stem);stroke-width:1.6;stroke-linecap:round}
.p-vein{fill:none;stroke:var(--leaf-a);stroke-width:.9;opacity:.55}
.p-sepal{fill:var(--leaf-a)} .p-stamen{fill:var(--stamen)} .p-shadow{fill:var(--plant-shadow)}
.p-hi{fill:none;stroke:var(--hi);stroke-width:3.5;stroke-linecap:round} .p-pblm{fill:var(--pot-bloom)} .p-shine{fill:var(--hi)}
.p-goldline{stroke:var(--gold-bright);stroke-width:2} .p-body{fill:var(--ink)} .p-ground{fill:var(--leaf-soft)} .p-fall{fill:var(--pk2)}
.hl{opacity:.6;animation:hlp 1.3s ease-in-out infinite alternate}
@keyframes hlp{from{opacity:.25}to{opacity:.9}}
.change{position:relative;align-self:center;max-width:100%;display:block;text-align:center;font-weight:700;font-size:.9rem;line-height:1.5;color:var(--leaf-dark);text-wrap:balance}
.change.mute{color:var(--muted);font-weight:500;box-shadow:none}
.change.new{animation:pop .6s ease-out 1.1s both}
.change .spark{color:var(--gold-bright);font-size:1.1rem;margin-right:4px}
/* cards */
.card{background:var(--surface);border-radius:22px;padding:18px;box-shadow:0 2px 12px var(--shadow);display:flex;flex-direction:column;gap:12px}
.card h3{font-size:1.15rem;line-height:1.4}
.eyebrow{font-size:.8rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
.btn{min-height:3rem;border-radius:999px;padding:8px 20px;border:2px solid var(--leaf);background:var(--surface);color:var(--leaf-dark);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.solid{background:var(--leaf);color:var(--on-leaf)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* morning image */
.frame{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/5;width:100%;max-width:100%;background:linear-gradient(160deg,var(--sky1),var(--sky2))}
.frame img{display:block;width:100%;height:100%;object-fit:cover;-webkit-touch-callout:default;user-select:auto}
.frame img.reveal{animation:reveal .9s ease-out}
.blurimg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(16px) saturate(1.2)}
.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
.lock .ring{width:4.4rem;height:4.4rem;border-radius:50%;background:var(--coral);color:var(--on-coral);display:grid;place-items:center;box-shadow:0 6px 18px var(--shadow)}
.lock .ring svg{width:2rem;height:2rem}
.lock .pill{background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 18px;font-weight:700;box-shadow:0 4px 14px var(--shadow)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}

/* partner question */
.care{border:2px solid var(--gold-bright);background:var(--gold-soft);box-shadow:none}
.care .eyebrow{color:var(--gold)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:3.2rem;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left;padding:10px 16px;font-weight:500}
.opt:active,.opt.sel{border-color:var(--leaf);background:var(--leaf-soft)}
.reply{display:flex;gap:10px;align-items:flex-start}
.avatar{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--coral-soft);color:var(--coral-text);display:grid;place-items:center;font-weight:900}
.bubble{background:var(--surface);border:2px solid var(--coral-soft);border-radius:4px 18px 18px 18px;padding:10px 14px;min-width:0}
.bubble b{display:block;font-size:.8rem;color:var(--coral-text)}

/* surprise card */
.flip{width:100%;min-height:4.2rem;border-radius:22px;border:2px solid var(--coral-soft);background:var(--surface);color:var(--coral-text);font-size:1.1rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 12px var(--shadow)}
.flip .gift svg{width:1.6rem;height:1.6rem;display:block}
.prize{border-radius:22px;background:var(--surface);border:2px solid var(--coral-soft);padding:16px 18px;text-align:center;animation:pop .5s ease-out}
.prize .p-big{font-family:var(--f-fun);font-size:1.4rem;color:var(--coral-text);line-height:1.3}
.frame.teaser{aspect-ratio:16/9}

/* log page */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .wd{font-size:.8rem;color:var(--muted)}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-size:.95rem}
.cal .d.on{background:var(--leaf);color:var(--on-leaf);font-weight:700}
.cal .d.today{box-shadow:inset 0 0 0 3px var(--coral)}
.cal .d.pre{color:var(--line)}
.path{display:flex;flex-direction:column}
.stone{display:grid;grid-template-columns:3rem 1fr;gap:12px;align-items:center;position:relative;padding-bottom:14px}
.stone:not(:last-child)::before{content:"";position:absolute;left:1.42rem;top:3rem;bottom:0;width:3px;background:var(--line)}
.stone.got:not(:last-child)::before{background:var(--leaf)}
.mini{width:3rem;height:3rem;border-radius:50%;background:var(--bg);border:3px solid var(--line);display:grid;place-items:center;overflow:hidden}
.mini svg{height:2.5rem;width:auto}
.stone.got .mini{border-color:var(--leaf);background:var(--leaf-soft)}
.stone.next .mini{border-color:var(--gold-bright)}
.stone.next .mini svg{opacity:.85}
.mini.secret{font-family:var(--f-fun);font-size:1.4rem;color:var(--muted);border-style:dashed}
.stone h4{font-size:1.05rem}
.fsopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fsopt{min-height:5rem;border-radius:16px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;font-weight:700}
.fsopt[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf-dark)}
.qa{display:flex;flex-direction:column;gap:10px}
.qa div{border-bottom:1px solid var(--line);padding-bottom:8px}
.qa div:last-child{border:0}

/* feelings */
.metric{display:flex;flex-direction:column;gap:6px}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.face{min-height:3.2rem;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:1.5rem;line-height:1}
.face[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:3rem}
textarea{min-height:5.5rem;resize:vertical}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem}
.legend span::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
.chart{width:100%;height:auto;display:block}
.note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}

/* nav, overlay, misc */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;max-width:520px}
nav.tabs button{border:0;background:none;min-height:3.6rem;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:.9rem;font-weight:700}
nav.tabs button svg{width:1.5rem;height:1.5rem}
nav.tabs button[aria-current="page"]{color:var(--coral-text);background:var(--coral-soft)}
#overlay{position:fixed;inset:0;background:rgba(20,10,6,.6);display:grid;place-items:center;padding:16px;z-index:10}
#overlay .box{background:var(--surface);border-radius:28px;padding:24px 22px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .5s ease-out}
#overlay .box svg{height:9rem;width:auto}
#overlay .medal{font-family:var(--f-fun);font-size:2.1rem;color:var(--coral-text);line-height:1.2}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
details.demo{border:1px dashed var(--line);border-radius:16px;padding:8px 14px;color:var(--muted);font-size:.85rem}
details.demo summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
footer.fine{font-size:.78rem;color:var(--muted);text-align:center;line-height:1.6}

@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes grow{0%{transform:scale(.9)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes drop{0%{transform:translateY(-30px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(7rem) scale(.6);opacity:0}}
@keyframes ring{0%{opacity:.7;transform:scale(.97)}100%{opacity:0;transform:scale(1.07)}}
@keyframes stamp{0%{transform:scale(2.4) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
@keyframes bump{40%{transform:scale(1.25)}}
@keyframes floatUp{0%{transform:translate(-50%,0);opacity:0}15%{opacity:1}100%{transform:translate(-50%,-80px);opacity:0}}
@keyframes pop{from{transform:scale(.85);opacity:.3}to{transform:none;opacity:1}}
@keyframes reveal{from{filter:blur(16px);transform:scale(1.06)}to{filter:none;transform:none}}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-2deg)}94%{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}.drop{display:none}}
</style>

const f1=v=>Math.round(v*10)/10;
function grow(n){
  const P={cot:false,main:0,big:false,branches:false,bl:0,buds:[],pot:0,bf:0,glow:false,ground:0,today:[],label:''};
  for(let d=1;d<=n;d++){
    let T=[],L='';
    if(d===1){P.cot=true;T=['cot'];L='种子发芽了，长出两片小嫩叶'}
    else if(d<=6||(d>=8&&d<=17)){P.main++;T=['m'+(P.main-1)];L=`长出第 ${P.main} 片叶子`}
    else if(d===7){P.main+=2;P.big=true;P.bf=1;T=['m'+(P.main-2),'m'+(P.main-1),'bf0'];L='一下子长高了，叶子变大，还飞来一只蝴蝶'}
    else if(d===18){P.branches=true;P.bl=4;T=['b0','b1','b2','b3'];L='长出两根新枝，多了 4 片叶子'}
    else if(d<=24){P.bl++;T=['b'+(P.bl-1)];L=`长出第 ${P.main+P.bl} 片叶子`}
    else if(d===25){P.pot=1;[0,1,2].forEach(s=>P.buds.push({s,st:0}));T=['k0','k1','k2','pot'];L='结出第一批花苞，还换上了新花盆'}
    else if(d<=54){
      if((d-26)%2===0){const s=P.buds.length;P.buds.push({s,st:0});T=['k'+s];L=`又多了一个花苞，现在有 ${P.buds.length} 个`}
      else{const b=P.buds.find(b=>b.st===0);b.st=1;T=['k'+b.s];L='一个花苞变红了，快要开了'}
    }
    else if(d===55){P.buds.forEach(b=>b.st=2);P.bf=2;T=['allk','bf1'];L=`花开了！一下子开了 ${P.buds.length} 朵`}
    else if(d<=73){const b=P.buds.find(b=>b.st===2&&b.s)||P.buds.find(b=>b.st===2);if(b){b.st=3;T=['k'+b.s]}L='一朵花开得更大、更漂亮了'}
    else if(d===74){P.buds[0].st=4;T=['k0'];L='最顶上的花，开成了最大的一朵'}
    else if(d===75){P.glow=true;P.bf=3;T=['glow','bf2'];L='花开满枝，好习惯养成了！'}
    else if(P.ground<15){P.ground++;T=['g'+(P.ground-1)];L=`花盆旁边开出一朵小花（第 ${P.ground} 朵）`}
    else L='今天的花园，也开得很美';
    if(d===n){P.today=T;P.label=L}
  }
  return P;
}

function taper(pts,w0,w1){
  const L=[],R=[],n=pts.length;
  for(let i=0;i<n;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    const w=(w0+(w1-w0)*i/(n-1))/2;L.push([pts[i][0]-dy*w,pts[i][1]+dx*w]);R.push([pts[i][0]+dy*w,pts[i][1]-dx*w])}
  return 'M'+L.map(pt2).join('L')+'L'+R.reverse().map(pt2).join('L')+'Z';
}

    const B=mk(62,48-3*k,91,41+2*k,.42),ang=7,px=B.cx+B.a*.7,py=B.b+5,cs=Math.cos(ang*Math.PI/180),sn=Math.sin(ang*Math.PI/180);
    const rot=(x,y)=>[px+(x-px)*cs-(y-py)*sn,py+(x-px)*sn+(y-py)*cs];
    const fx=B.cx+B.a*.4,fy=B.t+(B.b-B.t)*.5,hx=B.cx+B.a*.52,[lx,ly]=rot(B.cx-B.a*.5,B.b-6);
    const leg=(x,far)=>`<path d="M${R(x-6)} ${R(ly-6)}V95.4Q${R(x-6)} 100 ${R(x)} 100Q${R(x+6.4)} 100 ${R(x+6.4)} 95.4V${R(ly-6)}Z" fill="${far?C.far:C.b}" stroke="${C.o}" stroke-width="${OW}"/><ellipse cx="${R(x+.6)}" cy="97" rx="5" ry="2.6" fill="${far?C.far:C.p}"/>`;
    s+=shadow(70,48)+leg(lx+5,1)+tube(`M${R(px-2)} ${R(B.b-4)}L${R(px+8)} 95`,8.6,C.far)+paw(px+12,95.8,9,4,C.far);
    let g=cat?catTail(B.cx-B.a+6,B.t+12,[[-10,-6,-8,-24,4,-30],[-12,-4,-12,-22,-2,-30]],1.6,tl):dogTail(B.cx-B.a+6,B.t+10,-1,14,.4);
    g+=sideEars(B)+body(B)+stripes(B.cx-B.a*.3,topY(B,B.cx-B.a*.3)-1,5.5);
    g+=clip(B,`<ellipse cx="${R(B.cx+5)}" cy="${R(B.b-7)}" rx="${R(B.a*.5)}" ry="8" fill="${C.l}"/>${pattern(B,fx+.8*6.5,fy,1)}${headband(B,hx)}`)+gloss(B)+bib(B.cx+2,B.b-11,13,7);
    g+=collar(fx+sh1(.8),fy+14,15)+flops(hx,topY(B,hx),.72,-10);
    g+=face(fx,fy,.8,'happy','yawn')+hat(hx,topY(B,hx)+.5,B.a*.9);
    s+=`<g transform="rotate(${ang} ${R(px)} ${R(py)})">${g}</g>`+leg(lx-3,0)+tube(`M${R(px-6)} ${R(B.b-2)}L${R(px+10)} 96.4`,9,C.b)+paw(px+15,96.6,9.6,4.4);
  }
  function sh1(tn){return tn*6.5*1.18}
  return `<svg viewBox="0 0 140 104" role="img" aria-label="${cat?'小猫':'小狗'}">${s}</svg>`;
}

/* ---------- pet behaviour: waddles, runs, sits, looks around, waves, grooms, lies down, stretches, chases its ball ---------- */
let PET={x:null,face:1,t:0,bx:null,woke:false};
function petPose(pose,cls){const el=$('#petw'),pin=$('#petin');if(!el||!pin)return;pin.innerHTML=petSVG(S.pet,+el.dataset.stage,el.dataset.cos||'',pose,S.fur);pin.className='pet-in'+(PET.face<0?' mirror':'')+(cls?' '+cls:'')}
function petMove(el,x,dur,ease){el.style.transition=dur?`transform ${dur.toFixed(2)}s ${ease||'linear'}`:'none';el.style.transform=`translateX(${Math.round(x)}px)`}
function petStart(){
  clearTimeout(PET.t);const el=$('#petw');if(!el)return;
  const W=el.parentElement.clientWidth,w=el.offsetWidth,minX=-w*.06,maxX=Math.max(minX,W-w*.94),home=Math.max(minX,Math.min(maxX,W/2-w-6));
  const awake=el.dataset.mode==='awake',gentle=calm();
  if(PET.x==null||!awake)PET.x=home;
  PET.x=Math.max(minX,Math.min(maxX,PET.x));petMove(el,PET.x,0);el.style.opacity=1;
  if(awake&&PET.face<0)$('#petin').classList.add('mirror');
  const ball=$('#ball');
  if(ball){if(PET.bx==null)PET.bx=Math.min(W-28,W/2+44);ball.style.transition='none';ball.style.transform=`translateX(${Math.round(PET.bx)}px)`}
  if(!awake)return;
  const rest=(p,ms)=>{petPose(p,'');PET.t=setTimeout(step,ms)};
  const go=(tx,run,after)=>{tx=Math.max(minX,Math.min(maxX,tx));const d=Math.abs(tx-PET.x);if(d<20){after();return}
    if(gentle)run=false;PET.face=tx>PET.x?1:-1;petPose(run?'run':'walk','');
    const dur=d/(run?85+Math.random()*20:26+Math.random()*10);
    petMove(el,tx,dur,run?'cubic-bezier(.3,.6,.35,1)':'cubic-bezier(.4,.1,.6,.9)');PET.x=tx;PET.t=setTimeout(after,dur*1000+80)};
  function step(){
    if(!document.body.contains(el))return;
    const r=Math.random(),st=+el.dataset.stage;
    if(ball&&!gentle&&r<.2)go(PET.bx-w*.55,true,()=>{const nb=8+Math.random()*(W-40);PET.bx=nb;ball.style.transition='transform 1.4s cubic-bezier(.2,.7,.3,1)';ball.style.transform=`translateX(${Math.round(nb)}px)`;rest('sit',1000)});
    else if(r<.58)go(minX+Math.random()*(maxX-minX),Math.random()<.25,()=>rest(Math.random()<.5?'sit':'look',1300+Math.random()*1500));
    else if(r<.70)rest(st>=4&&Math.random()<.5?'wave':'sit',2600+Math.random()*2400);
    else if(r<.79)rest('look',1800+Math.random()*1400);
    else if(r<.89)rest('lie',3200+Math.random()*3000);
    else if(r<.96)rest('groom',2200+Math.random()*1400);
    else rest('stretch',1700);
  }
  if(PET.woke){PET.woke=false;PET.t=setTimeout(()=>rest('stretch',1800),1200)}else rest('sit',1200);
}

/* the Google Sheet arrives as CSV; quoted cells may hold commas and line breaks */
function csvRows(t){const R=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);R.push(row);row=[];f=''}
    else f+=c}
  if(f||row.length){row.push(f);R.push(row)}return R}
/* a Google Drive share link becomes an image address the page can show */
const imgURL=u=>{u=(u||'').trim();const m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{10,})/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1000':/^https:\/\//.test(u)?u:''};
const newsDate=d=>{d=(d||'').trim().replace(/\./g,'/');let m=d.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=d.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):''};

  return R.slice(1).map(r=>{const g=k=>ci[k]>=0?(r[ci[k]]||'').trim():'',d=newsDate(g('date')),title=g('title');if(!d||!title)return null;

function careDay(){const d=dayNum(),t=today();for(let k=d;k>=Math.max(1,d-2);k--){if(!CARE[k])continue;const a=S.answers[k];if(k===d||!a||a.d===t)return k}return 0}

/* ---------- feelings ---------- */
function chart(){
  const F=S.feel;if(!F.length)return '<p class="note">记录第一次以后，这里会画出你的变化。</p>';
  const W=320,H=170,L=30,R=14,T=12,B=30,xs=i=>F.length===1?(L+W-R)/2:L+i*(W-L-R)/(F.length-1),ys=v=>T+(5-v)*(H-T-B)/4;
  const faces=['😣','🙁','😐','🙂','😄'];let g='';
  for(let v=1;v<=5;v++)g+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" style="stroke:var(--line)"/><text x="4" y="${ys(v)+6}" font-size="15">${faces[v-1]}</text>`;
  const ser=[['e','var(--leaf)'],['s','var(--gold-bright)'],['g','var(--coral)']].map(([k,c])=>
    `<polyline style="fill:none;stroke:${c};stroke-width:3;stroke-linejoin:round" points="${F.map((f,i)=>xs(i)+','+ys(f[k])).join(' ')}"/>`+
    F.map((f,i)=>`<circle cx="${xs(i)}" cy="${ys(f[k])}" r="${i===F.length-1?5.5:4}" style="fill:${c}"/>`).join('')).join('');
  const lab=F.map((f,i)=>`<text x="${xs(i)}" y="${H-8}" font-size="12" text-anchor="middle" style="fill:var(--muted)">第${f.day}天</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="感觉变化图">${g}${ser}${lab}</svg>
    <div class="legend"><span style="--c:var(--leaf)">精神</span><span style="--c:var(--gold-bright)">睡眠</span><span style="--c:var(--coral)">肠胃</span></div>
    ${F.length<2?'<p class="note">每个星期记录一次，就能看到自己的变化。</p>':''}`;
}
function viewFeel(){
  const last=S.feel[S.feel.length-1],can=!last||diff(last.d,today())>=7;
  const M=[['e','精神'],['s','睡眠'],['g','肠胃']],faces=['😣','🙁','😐','🙂','😄'];
  const form=can?`<div class="card"><h3 class="ch"><span class="ci">${I.heart}</span>这个星期感觉怎样？</h3>${M.map(([k,l])=>`<div class="metric"><span>${l}</span><div class="faces">${faces.map((f,i)=>`<button class="face" data-m="${k}" data-v="${i+1}" aria-pressed="${draft[k]===i+1}" aria-label="${l} ${i+1}分">${f}</button>`).join('')}</div></div>`).join('')}
      <button class="btn solid" data-act="feel" ${draft.e&&draft.s&&draft.g?'':'disabled'}>保存这星期的感觉（+10 积分）</button></div>`
    :`<div class="card"><h3 class="ch"><span class="ci">${I.heart}</span>这星期已经记录了</h3><p class="muted">${7-diff(last.d,today())} 天后再来记录一次。</p></div>`;
  const qs=S.questions.map(q=>`<div><p class="small muted">第 ${q.day} 天</p><p>${esc(q.text)}</p><p class="small" style="color:var(--leaf-dark)">已打开 WhatsApp 发给 ${esc(S.partner)}</p></div>`).join('');
  return miniScene('我的感觉','这里只记录感觉，不是医疗诊断')+
    `${form}<div class="card"><h3 class="ch"><span class="ci g">${I.chart}</span>我的变化</h3>${chart()}</div>

      ${qs?`<div class="qa">${qs}</div>`:''}</div>`+footer();
}

function confetti(){
  if(calm())return;
  const c=$('#fx'),x=c.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight;
  c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);c.hidden=false;
  const cs=getComputedStyle(document.documentElement),cols=['--coral','--gold-bright','--leaf','--petal','--petal2'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:110},()=>({x:W/2+(Math.random()-.5)*W*.4,y:H*.42,vx:(Math.random()-.5)*13,vy:-Math.random()*15-6,r:Math.random()*7+5,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.35}));
  let f=0;(function step(){x.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.42;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++f<120)requestAnimationFrame(step);else{x.clearRect(0,0,W,H);c.hidden=true}})();
}
function celebrate(m){
  const o=$('#overlay'),line=m.stage==='开花'?'你的花开了！':`你的花${m.stage}了！`;
  o.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-label="${m.name}"><div class="ov-pics">${plantSVG(m.n,{hl:true})}${petSVG(S.pet,petStage(m.n),'','sit',S.fur)}</div>
    <div class="medal">${m.name}</div><p style="font-size:1.15rem;font-weight:700">${line}累计打卡 ${m.n} 天</p><p>${esc(S.petName)}${PET_MS[m.id]||''}</p>
    <p>你的奖励：<b>${m.gift}</b></p><a class="btn solid" href="${waLink(`${S.partner} 你好，我是${S.name}，我完成了「${m.name}」，累计打卡 ${m.n} 天！奖励是：${m.gift}`)}" target="_blank" rel="noopener">告诉 ${esc(S.partner)} 领取奖励</a>
    <button class="checkin" style="min-height:4rem;font-size:1.2rem;margin-top:6px" data-act="close"><span>好的</span></button></div>`;
  o.hidden=false;o.querySelector('button').focus();confetti();
}
function checkMile(){
  const n=count(),news=MILES.filter(x=>n>=x.n&&!S.gifts[x.id]);if(!news.length)return false;
  news.forEach(x=>S.gifts[x.id]=today());save();celebrate(news[news.length-1]);return true;
}
function keepName(){const el=$('#nm');if(el)draftName=el.value}
function afterWater(scroll){
  render();justChecked=false;bumpPts();confetti();
  setTimeout(()=>document.querySelectorAll('.drop').forEach(el=>el.remove()),1200);
  setTimeout(()=>{if(!checkMile()){if(scroll)toDone();setTimeout(maybeNews,1900)}},1700);
}

document.addEventListener('click',e=>{
  const ak=e.target.closest('a[data-act=ask]');
  if(ak){const q=$('#q'),v=q?q.value.trim():'';if(!v){e.preventDefault();if(q)q.focus();return}
    ak.href=waLink(askText(v));S.questions.unshift({day:dayNum(),text:v});save();setTimeout(render,400);return}
  const b=e.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.act,t=today();
  if(b.dataset.tab){tab=b.dataset.tab;render();scrollTo(0,0);return}
  if(b.dataset.fs){keepName();S.fs=b.dataset.fs;save();render();return}
  if('period' in b.dataset){demoP=b.dataset.period;render();return}
  if(b.dataset.fur){if(S.onboarded){S.fur=b.dataset.fur;save()}else{keepName();draftFur=b.dataset.fur}render();return}
  if(b.dataset.pet){keepName();draftPet=b.dataset.pet;draftFur='';if(['','招财','旺财'].includes(draftPetName.trim()))draftPetName=PETN[draftPet];render();return}
  if(b.dataset.care){const d=b.dataset.care;S.answers[d]={a:b.dataset.a,d:t};S.points+=5;save();
    if(b.dataset.a==='去记录我的感觉')tab='feel';render();bumpPts();return}
  if(b.dataset.m){draft[b.dataset.m]=+b.dataset.v;render();return}
  if('quiz' in b.dataset){const f=S.flips[t];if(f&&f.type==='quiz'&&f.ans==null){f.ans=+b.dataset.quiz;const ok=f.ans===QUIZ[f.i].a;S.points+=ok?5:2;save();render();bumpPts();if(ok)confetti()}return}
  if(b.dataset.anchor){keepName();draftAnchor=b.dataset.anchor;render();return}
  switch(a){
    case 'check':S.checks[t]=1;S.points+=10;justChecked=true;PET.woke=true;save();afterWater(true);break;
    case 'makeup':S.checks[add(t,-1)]=1;S.points+=5;justChecked=true;save();afterWater(false);break;
    case 'fast':{if(S.checks[t])S.offset=(S.offset||0)+1;
      for(let i=0;i<7;i++){S.checks[today()]=1;S.points+=10;if(i<6)S.offset=(S.offset||0)+1}
      justChecked=true;tab='today';save();scrollTo(0,0);afterWater(false);break}
    case 'jump':{const m=nextMile();if(!m)break;
      while(count()<m.n){if(S.checks[today()])S.offset=(S.offset||0)+1;S.checks[today()]=1;S.points+=10}
      justChecked=true;tab='today';save();scrollTo(0,0);afterWater(false);break}
    case 'flip':{const r=hash(t+S.name)%100,won=Object.keys(S.flips).some(d=>S.flips[d].type==='gift'&&diff(d,t)>=0&&diff(d,t)<30);
      /* stage 1 gifts and blessings; stage 2 fewer gifts, facts and quizzes; stage 3 no random gifts */
      const stg=stageOf(count()),G=[6,3,0][stg-1],P=[36,28,20][stg-1];let f;
      if(r<G&&!won)f={type:'gift'};else if(r<P){f={type:'pts'};S.points+=5}
      else if(stg===1)f={type:'bless',text:BLESS[hash(t)%BLESS.length]};
      else if(r<(P+100)/2){f={type:'fact',i:(S.factN||0)%FACTS.length};S.factN=(S.factN||0)+1}
      else{f={type:'quiz',i:(S.quizN||0)%QUIZ.length,ans:null};S.quizN=(S.quizN||0)+1}
      S.flips[t]=f;save();render();if(f.type==='gift'||f.type==='pts'){bumpPts();confetti()}break}
    case 'feel':S.feel.push({d:t,day:dayNum(),...draft});draft={e:0,s:0,g:0};S.points+=10;save();render();break;
    case 'ask':{const v=$('#q').value.trim();if(!v)return;S.questions.unshift({day:dayNum(),text:v});save();render();break}
    case 'a2hs':S.a2hs=true;save();render();break;
    case 'rename':{const v=($('#pn2')||{}).value;if(v&&v.trim()){S.petName=v.trim().slice(0,8);save();render()}break}
    case 'cos':demoCos=demoCos+1>=DEMO_COS.length?-1:demoCos+1;render();break;
    case 'cosoff':demoCos=-1;render();break;
    case 'close':$('#overlay').hidden=true;toDone();break;
    case 'nclose':$('#overlay').hidden=true;break;
    case 'news':{const id=b.dataset.nid,x=newsList().find(n=>n.id===id)||[newsNow().card].find(n=>n&&n.id===id);showNews(x);break}
    case 'newsdemo':showNews(newsNow().card||demoNews()[2]);break;
    case 'next':S.offset=(S.offset||0)+1;save();render();scrollTo(0,0);break;
    case 'prev':if(diff(S.start,add(t,-1))>=0){S.offset=(S.offset||0)-1;save();render()}break;
    case 'new':{const fs=S.fs;S=fresh();S.fs=fs;draftName='';draftAnchor='';draftOk=false;draftPet='cat';draftFur='';draftPetName='招财';draftBM='';draftBD='';tab='today';save();render();scrollTo(0,0);break}
    case 'sample':S=seed();tab='today';save();render();scrollTo(0,0);break;
    case 'start':keepName();if(!(draftName.trim()&&draftAnchor&&draftOk))return;
      S.name=draftName.trim();S.anchor=draftAnchor;S.pet=draftPet;S.fur=furOf(draftPet,draftFur).k;S.petName=(draftPetName.trim()||PETN[draftPet]).slice(0,8);
      S.bday=draftBM&&draftBD?String(draftBM).padStart(2,'0')+'-'+String(draftBD).padStart(2,'0'):'';S.onboarded=true;S.consent=t;S.start=t;tab='today';save();render();scrollTo(0,0);break;
  }
});
document.addEventListener('change',e=>{if(e.target.id==='bm')draftBM=e.target.value;if(e.target.id==='bd')draftBD=e.target.value});
document.addEventListener('input',e=>{if(e.target.id==='pn')draftPetName=e.target.value;if(e.target.id==='q'){const a=$('#askbtn');if(a)a.href=waLink(askText(e.target.value.trim()))}if(e.target.id==='nm'){draftName=e.target.value;const s=document.querySelector('[data-act=start]');if(s)s.disabled=!(draftName.trim()&&draftAnchor&&draftOk)}});
document.addEventListener('change',e=>{if(e.target.id==='ok'){keepName();draftOk=e.target.checked;render()}});

S=load()||(DEMO?seed():fresh());
if(!S.pet){S.pet='cat';S.petName='招财';S.bday=S.bday||''}
if(!S.fur)S.fur=furOf(S.pet,'').k;
if(!S.seen)S.seen=[];
if(PI.phone)S.pphone=PI.phone;
if(PI.name)S.partner=PI.name;
save();loadNews();render();fetchNews();
if(!DEMO&&tab==='today'&&S.onboarded&&S.checks[today()])setTimeout(maybeNews,1500);
</script>
</body></html>
